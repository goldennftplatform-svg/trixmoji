 <script>
try {
 if (localStorage.getItem('doswapz_skip_lily') === '1') {
 window.location.replace('/classic/pages/nodes.html');
 }
 } catch (e) {}

 const glitchLayer = document.getElementById('glitchLayer');
 const video = document.getElementById('lilyVideo');
 const videoFallback = document.getElementById('videoFallback');

 function showVideoFallback() {
 if (videoFallback) videoFallback.classList.add('show');
 }

 function tryPlayVideo() {
 if (!video) return;
 const p = video.play();
 if (p && typeof p.catch === 'function') {
 p.catch(() => {
 // Autoplay blocked - first click anywhere retries playback
 document.body.addEventListener('click', function retry() {
 video.play().catch(() => {});
 document.body.removeEventListener('click', retry);
 }, { once: true });
 });
 }
 }

 if (video) {
 video.addEventListener('error', showVideoFallback);
 video.addEventListener('stalled', () => {
 if (video.readyState < 2) showVideoFallback();
 });
 video.addEventListener('loadeddata', () => {
 if (videoFallback) videoFallback.classList.remove('show');
 });
 tryPlayVideo();
 }

 function addGlitchBurst() {
 for (let i = 0; i < 3; i++) {
 setTimeout(() => {
 const b = document.createElement('div');
 b.style.position = 'absolute';
 b.style.left = Math.random() * 100 + '%';
 b.style.top = Math.random() * 100 + '%';
 b.style.width = (1 + Math.random() * 5) + '%';
 b.style.height = (1 + Math.random() * 3) + '%';
 b.style.background = Math.random() < 0.6 ? '#00ff00' : '#000';
 b.style.opacity = (0.22 + Math.random() * 0.32).toString();
 b.style.mixBlendMode = 'difference';
 b.style.zIndex = '22';
 glitchLayer.appendChild(b);
 setTimeout(() => {
 b.style.transition = 'opacity 65ms linear';
 b.style.opacity = '0';
 setTimeout(() => b.remove(), 55);
 }, 55);
 }, i * 16);
 }
 }

 function enterLilyPad() {
 var dest = (location.pathname.indexOf('/orbit/') >= 0)
 ? '/orbit/pages/nodes.html'
 : '/classic/pages/nodes.html';
 if (window.DOSWAPZ_TRANSITION) {
 window.DOSWAPZ_TRANSITION.navigate(dest);
 } else {
 window.location.href = dest;
 }
 }

 // Light glitch (consistent with site)
 setInterval(() => {
 if (Math.random() < 0.26) addGlitchBurst();
 }, 880);

 // Small initial glitch burst
 setTimeout(() => addGlitchBurst(), 280);

 // Optional: subtle hint if user wants to skip video
 // Button is always visible and centered over the video
 </script>
