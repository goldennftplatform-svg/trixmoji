<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Splash B</title>
 <style>
 @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
 * { box-sizing: border-box; }
 html, body { margin: 0; height: 100%; background: #000; color: #00ff00; font-family: 'VT323', monospace; overflow: hidden; }
 .screen {
 position: relative; height: 100%;
 background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,255,0,.03) 3px 5px);
 }
 .center { position: absolute; top: 34%; left: 50%; transform: translate(-50%,-50%); text-align: center; width: 94%; }
 .title { font-size: clamp(42px, 12vw, 64px); letter-spacing: 8px; text-shadow: 0 0 10px #00ff00; margin-bottom: 8px; }
 .tag {
 font-size: 14px; color: #00aa00; letter-spacing: 1px; line-height: 1.35;
 max-width: 28rem; margin: 0 auto 14px;
 }
 .tag b { color: #ffff00; font-weight: normal; }
 .enter { font-size: 22px; letter-spacing: 3px; color: #00dd00; cursor: pointer; }
 .enter .c { display: inline-block; width: 12px; animation: b 0.8s steps(1) infinite; }
 @keyframes b { 50% { opacity: 0; } }
 .cta {
 margin-top: 18px;
 display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px;
 font-size: 15px;
 }
 .cta a {
 color: #ffff00; text-decoration: none; border: 1px solid #335500; padding: 7px 12px;
 }
 .cta a.primary { border-color: #00ff41; color: #00ff41; box-shadow: 0 0 8px rgba(0,255,65,.25); }
 .cta a:hover { background: #003300; color: #fff; }
 .comsec {
 position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
 font-size: 11px; color: #00aa00; opacity: .75; text-align: center; max-width: 90%; line-height: 1.3;
 }
 .badge {
 position: absolute; top: 8px; right: 10px; font-size: 11px; color: #ffff00; border: 1px solid #554400; padding: 2px 6px;
 }
 </style>
</head>
<body>
 <div class="screen">
 <div class="badge">EXAMPLE B ★</div>
 <div class="center">
 <div class="title">DOSWAPZ</div>
 <div class="tag">
 <b>DEGEN OPTIMIZED SOVEREIGN WARFARE AGAINST PUMPZ</b><br>
 0% Solana swaps * meme games * basement markets * self-custody * DYOR
 </div>
 <div class="enter">enter here<span class="c"></span></div>
 <div class="cta">
 <a class="primary" href="#">ENTER HUB</a>
 <a href="#">0% SWAP</a>
 <a href="#">DOCS / LEGAL</a>
 </div>
 </div>
 <div class="comsec">COMSEC / OPSEC - never risk funds you cannot afford to lose.</div>
 </div>
</body>
</html>
