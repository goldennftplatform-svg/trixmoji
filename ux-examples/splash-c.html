<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash C</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #00ff00; font-family: 'VT323', monospace; overflow: hidden; }
    .screen {
      position: relative; height: 100%; padding: 16px 14px;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,255,0,.03) 3px 5px);
    }
    .badge {
      position: absolute; top: 8px; right: 10px; font-size: 11px; color: #ffff00; border: 1px solid #554400; padding: 2px 6px;
    }
    .path { color: #ffff00; font-size: 14px; margin-bottom: 10px; }
    .title { font-size: 28px; letter-spacing: 4px; margin-bottom: 6px; text-shadow: 0 0 8px #00ff00; }
    .sub { color: #00aa00; font-size: 13px; margin-bottom: 14px; }
    .dir {
      border: 1px solid #003300; background: rgba(0,12,0,.5); padding: 10px 12px;
      font-size: 16px; line-height: 1.55; max-width: 360px;
    }
    .dir a {
      display: block; color: #00ff41; text-decoration: none; padding: 4px 0;
    }
    .dir a:hover { color: #ffff00; }
    .dir .dim { color: #007700; }
    .dir .num { color: #ffff00; margin-right: 8px; }
    .hint { margin-top: 12px; font-size: 13px; color: #00aa00; }
    .comsec {
      position: absolute; bottom: 12px; left: 14px; right: 14px;
      font-size: 11px; color: #006600; line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="badge">EXAMPLE C</div>
    <div class="path">C:\DOSWAPZ\&gt;</div>
    <div class="title">DOSWAPZ</div>
    <div class="sub">Directory of the bunker. Pick a node.</div>
    <div class="dir">
      <a href="#"><span class="num">1</span> SYSTEM_MENU.HUB <span class="dim">// main</span></a>
      <a href="#"><span class="num">2</span> SWAP.EXE <span class="dim">// 0% jupiter</span></a>
      <a href="#"><span class="num">3</span> ARCADE\ <span class="dim">// games</span></a>
      <a href="#"><span class="num">4</span> TIME_MACHINE <span class="dim">// eras</span></a>
      <a href="#"><span class="num">5</span> DOCS\LEGAL.TXT</a>
      <a href="#"><span class="num">0</span> ENTER (default boot)</a>
    </div>
    <div class="hint">Type number or click. Esc still feels optional.</div>
    <div class="comsec">Not financial advice. Self-custody only. 18+.</div>
  </div>
</body>
</html>
