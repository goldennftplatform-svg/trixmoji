<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOSWAPZ // HUB EXAMPLE — REGEN/DEGEN FARMING</title>
  <meta name="robots" content="noindex" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --green: #00ff00;
      --green-dim: #00aa00;
      --neon-pink: #ff2bd6;
      --neon-cyan: #00f0ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--green);
      font-family: 'VT323', 'Courier New', monospace;
    }

    .dos-screen {
      position: relative;
      min-height: 100vh;
      padding: 0 24px 64px;
    }

    .dos-screen::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 3px,
        rgba(0, 255, 0, 0.035) 3px 5px
      );
    }

    .content {
      position: relative;
      z-index: 10;
      max-width: 720px;
      margin: 0 auto;
      padding-top: 6vh;
      text-align: center;
    }

    .example-banner {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 12px;
      border: 1px solid #445500;
      color: #ffff00;
      letter-spacing: 2px;
      font-size: 16px;
    }

    .doswap {
      font-size: clamp(48px, 11vw, 72px);
      letter-spacing: 10px;
      text-shadow: 0 0 4px var(--green), 0 0 12px var(--green-dim);
      line-height: 1;
      margin-bottom: 6px;
    }

    .menu-prompt {
      font-size: clamp(20px, 4.5vw, 28px);
      letter-spacing: 3px;
      color: #00dd00;
      margin-bottom: 18px;
    }

    .menu-prompt .cursor {
      display: inline-block;
      width: 14px;
      animation: blink 820ms steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .menu {
      text-align: left;
      max-width: 520px;
      margin: 0 auto;
    }

    .section-head {
      display: block;
      font-size: 26px;
      color: #ffff00;
      letter-spacing: 3px;
      padding: 6px 0;
      text-decoration: none;
    }

    .section-head::before {
      content: '+ ';
      color: var(--green-dim);
    }

    .options {
      margin: 4px 0 16px 18px;
      font-size: 22px;
      line-height: 1.45;
    }

    .option {
      display: block;
      color: var(--green);
      text-decoration: none;
      padding: 2px 0;
    }

    .option::before {
      content: '> ';
      color: var(--green-dim);
    }

    .option:hover { color: #ffff00; }

    /* ── REGEN / DEGEN neon glitch ───────────────────────── */
    .option.regen-farm {
      color: #b8ffd8;
      position: relative;
      letter-spacing: 2px;
    }

    .option.regen-farm:hover {
      color: #fff;
      text-shadow:
        0 0 6px var(--neon-cyan),
        0 0 14px rgba(255, 43, 214, 0.55);
    }

    .option.regen-farm::before {
      color: #ff2bd6;
      text-shadow: 0 0 8px #ff2bd6;
    }

    /*
      First letter sits in normal text flow (same baseline as EGEN).
      Invisible spacer holds glyph width; R/D overlay that box exactly.
    */
    .neon-flip {
      display: inline-block;
      position: relative;
      vertical-align: baseline;
      line-height: inherit;
      font: inherit;
      letter-spacing: inherit;
    }

    .neon-flip .spacer {
      visibility: hidden;
      speak: never;
    }

    .neon-flip .r,
    .neon-flip .d {
      position: absolute;
      left: 0;
      top: 0;
      margin: 0;
      padding: 0;
      line-height: inherit;
      font: inherit;
      letter-spacing: 0;
    }

    .neon-flip .r {
      color: #ff4de8;
      text-shadow:
        0 0 4px #ff2bd6,
        0 0 12px #ff2bd6,
        0 0 22px rgba(0, 240, 255, 0.45);
      animation:
        show-r 2.6s steps(1, end) infinite,
        neon-flicker 0.18s steps(1, end) infinite;
    }

    .neon-flip .d {
      color: #00f0ff;
      text-shadow:
        0 0 4px #00f0ff,
        0 0 14px #ff2bd6,
        1px 0 0 rgba(255, 0, 80, 0.65),
        -1px 0 0 rgba(0, 255, 255, 0.5);
      animation:
        show-d 2.6s steps(1, end) infinite,
        neon-flicker 0.18s steps(1, end) infinite;
    }

    @keyframes show-r {
      0%, 11% { opacity: 1; visibility: visible; }
      12%, 19% { opacity: 0; visibility: hidden; }
      20%, 54% { opacity: 1; visibility: visible; }
      55%, 64% { opacity: 0; visibility: hidden; }
      65%, 78% { opacity: 1; visibility: visible; }
      79%, 84% { opacity: 0; visibility: hidden; }
      85%, 100% { opacity: 1; visibility: visible; }
    }

    @keyframes show-d {
      0%, 11% { opacity: 0; visibility: hidden; }
      12%, 19% { opacity: 1; visibility: visible; }
      20%, 54% { opacity: 0; visibility: hidden; }
      55%, 64% { opacity: 1; visibility: visible; }
      65%, 78% { opacity: 0; visibility: hidden; }
      79%, 84% { opacity: 1; visibility: visible; }
      85%, 100% { opacity: 0; visibility: hidden; }
    }

    @keyframes neon-flicker {
      0%, 100% { filter: brightness(1); }
      40% { filter: brightness(1.35); }
      42% { filter: brightness(0.45); }
      44% { filter: brightness(1.2); }
      70% { filter: brightness(0.95); }
      71% { filter: brightness(0.25); }
      73% { filter: brightness(1); }
    }

    .rest {
      color: #9dffc8;
      text-shadow: 0 0 6px rgba(0, 255, 180, 0.25);
    }

    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: #005500;
      letter-spacing: 1px;
    }

    .footer a { color: #88aa00; }
  </style>
</head>
<body>
  <div class="dos-screen">
    <div class="content">
      <div class="example-banner">SAMPLE · LIVE HUB NOW HAS THIS (classic/hub.html)</div>
      <div class="doswap">DOSWAPZ</div>
      <div class="menu-prompt">SYSTEM MENU<span class="cursor">_</span></div>

      <div class="menu">
        <div class="section-head">LIVE</div>
        <div class="options">
          <a class="option" href="#">Crypto Dad</a>
          <a class="option" href="#">Swap</a>
          <a class="option" href="#">Arcade</a>

          <!-- EXAMPLE: REGEN FARMING with R↔D neon glitch → uniphihq -->
          <a
            class="option regen-farm"
            href="https://www.uniphihq.com/"
            target="_blank"
            rel="noopener noreferrer"
            title="REGEN / DEGEN FARMING"
          >
            <span class="neon-flip" aria-hidden="true"><span class="spacer">R</span><span class="r">R</span><span class="d">D</span></span><span class="rest">EGEN FARMING</span>
          </a>
        </div>

        <div class="section-head">NODES</div>
        <div class="options">
          <a class="option" href="#">Mint</a>
          <a class="option" href="#">Attic</a>
        </div>
      </div>

      <div class="footer">
        EXAMPLE HUB · click REGEN/DEGEN FARMING → uniphihq.com<br />
        <a href="/ux-examples/hub-gallery.html">← hub gallery</a>
        ·
        <a href="/classic/hub.html">live hub</a>
      </div>
    </div>
  </div>
</body>
</html>
