<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto School — Start From Zero</title>
<meta name="description" content="A beginner-first crypto education app.">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f4f5f7;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:28px 22px 70px}
.hero{padding:70px 0 55px;max-width:850px}.eyebrow{font-weight:800;letter-spacing:.18em;font-size:12px;color:#8f9bb0}
h1{font-size:clamp(42px,7vw,76px);line-height:.98;margin:15px 0 22px;letter-spacing:-.045em}.hero h1 span{color:#8ee7b2}
.hero p{font-size:19px;line-height:1.6;color:#aeb6c4;max-width:700px}.primary,.secondary,.back{border:0;border-radius:12px;padding:13px 18px;font-weight:800}.primary{background:#f3f5f7;color:#0b0d12}.secondary{background:#1b2029;color:#fff}.back{background:none;color:#9ca8ba;padding-left:0}
.stats{display:flex;gap:35px;margin-top:35px}.stats b{display:block;font-size:25px}.stats small,.level-head small,.lesson-meta,label{color:#8793a6;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800}
.level{border-top:1px solid #202631;padding:34px 0}.level-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px}.level-head h2{margin:5px 0;font-size:29px}.level-count{color:#8ee7b2;font-weight:800}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.lesson-card{display:flex;text-align:left;gap:15px;background:#11151c;border:1px solid #202631;color:#fff;border-radius:14px;padding:17px;min-height:90px}.lesson-card:hover{border-color:#596579;transform:translateY(-1px)}.lesson-card>span{font-size:19px;color:#778499}.lesson-card b{display:block;font-size:15px}.lesson-card small{display:block;color:#8793a6;margin-top:6px;line-height:1.35}.lesson-card.done{border-color:#294e3b}
.lesson{max-width:800px;margin:auto;padding-top:35px}.lesson-meta{margin:35px 0 12px}.lesson h1{font-size:clamp(40px,7vw,62px)}.explain,.analogy,.quiz{border-radius:18px;padding:25px;margin:18px 0}.explain{background:#171c25}.analogy{background:#112019;border:1px solid #234d37}.explain p,.analogy p{font-size:21px;line-height:1.55;margin:12px 0 0}.quiz{background:#141820}.quiz h3{font-size:20px;line-height:1.35}.answer{display:block;width:100%;text-align:left;padding:15px;margin:9px 0;border:1px solid #29303b;background:#0e1218;color:#fff;border-radius:11px}.answer:hover{border-color:#738095}.answer.correct{border-color:#62c58d;background:#153022}.answer.wrong{border-color:#d66d76;background:#32181c}.quiz #feedback{margin-top:14px;min-height:25px}.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
@media(max-width:600px){.wrap{padding:18px}.hero{padding-top:40px}.stats{gap:18px}.stats b{font-size:20px}.level-head{align-items:center}.lesson{padding-top:15px}}
</style>
</head>
<body><main class="wrap"><div id="app"></div></main>
<script src="app.js"></script>
</body></html>
