# DOSWAPZ v2 â€” Netlify static site + serverless API
# Publish root = project folder (index.html at top level)

[build]
  publish = "."
  command = "npm ci --omit=dev"

# Retire the previous TrixMoji public mint entry points. Contracts require
# separate creator-wallet pause transactions; redirects cannot pause them.
[[redirects]]
  from = "/classic/pages/clean-pop-mint.html"
  to = "/classic/pages/trixmoji-mint.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/clean-pop-webp-v2-mint.html"
  to = "/classic/pages/trixmoji-mint.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/clean-pop-market.html"
  to = "/classic/pages/trixmoji-market.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/phunk-market-preview.html"
  to = "/classic/pages/trixmoji-market.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/clean-pop-setup.html"
  to = "/classic/pages/pause-previous-mints.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/clean-pop-webp-v2-setup.html"
  to = "/classic/pages/pause-previous-mints.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/phunk-setup.html"
  to = "/classic/pages/pause-previous-mints.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/clean-pop-delivery.html"
  to = "/classic/pages/trixmoji-mint.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/clean-pop-reserved-master.html"
  to = "/classic/pages/trixmoji-mint.html"
  status = 302
  force = true

[[redirects]]
  from = "/classic/pages/replacement-market-test.html"
  to = "/classic/pages/trixmoji-market.html"
  status = 302
  force = true

[build.environment]
  NODE_VERSION = "20"

# Do NOT rewrite HTML hrefs (was stripping .html from bubble links and breaking the Present hub)
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@vercel/kv", "@netlify/blobs"]
  included_files = ["api/**", "assets/data/**", "assets/data/pond-activated-rigs.json"]

[functions."trixmoji-minted-page"]
  timeout = 26

# Pond dossier fans out to several upstreams — need headroom past default 10s
[functions."pond-dossier"]
  timeout = 26

[functions."pond-mining"]
  timeout = 20

[functions."pond-community"]
  timeout = 15

[functions."awardz-settle"]
  timeout = 26

[functions."awardz"]
  timeout = 20

[functions."dswpz-track"]
  timeout = 26

[functions."geoff-watch"]
  timeout = 26

[functions."trix-memes"]
  timeout = 26

[functions."trix-boxes"]
  timeout = 26

[functions."geoff-watch-cron"]
  timeout = 26
  schedule = "*/2 * * * *"

[functions."daily-watch"]
  timeout = 26

[functions."daily-watch-cron"]
  timeout = 26
  schedule = "12 * * * *"

[functions."hourly-watch-cron"]
  timeout = 26
  schedule = "7 * * * *"

[functions."deploy-watch"]
  timeout = 26

[functions."deploy-watch-cron"]
  timeout = 26
  schedule = "*/15 * * * *"

[functions."mail-gate"]
  timeout = 20

[functions."account"]
  timeout = 20

[functions."chain-scan"]
  timeout = 26

[functions."token-safety"]
  timeout = 26

[functions."quantum"]
  timeout = 26

[functions."ek"]
  timeout = 26

[functions."ethscriptions"]
  timeout = 26

# â”€â”€ Security headers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

[[headers]]
  for = "/access-notice.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # SAMEORIGIN so Present-era game shells can iframe classic engines on this domain.
    # (DENY made orbit FTWR / other present wrappers show a blank frame.)
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Media can stay long-lived. JS/CSS must revalidate or browsers keep
# stale shell/arcade scripts forever (badge, wheel, intro fixes never land).
[[headers]]
  for = "/classic/hub.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/classic/pages/quantum.html"
