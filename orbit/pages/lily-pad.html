 <script>
(function () {
 'use strict';

 var DEST = (location.pathname.indexOf('/orbit/') >= 0)
 ? '/orbit/pages/nodes.html'
 : '/classic/pages/nodes.html';

 try {
 if (localStorage.getItem('doswapz_skip_lily') === '1') {
 window.location.replace(DEST);
 return;
 }
 } catch (e) {}

 var glitchLayer = document.getElementById('glitchLayer');
 var video = document.getElementById('lilyVideo');
 var videoFallback = document.getElementById('videoFallback');
 var enterBtn = document.getElementById('enterLilyBtn');
 var statusEl = document.getElementById('lilyStatus');
 var navigating = false;

 function setStatus(msg) {
 if (statusEl) statusEl.textContent = msg || '';
 }

 function showVideoFallback() {
 if (videoFallback) videoFallback.classList.add('show');
 }

 function tryPlayVideo() {
 if (!video) return;
 var p = video.play();
 if (p && typeof p.catch === 'function') {
 p.catch(function () {
 document.body.addEventListener('click', function retry() {
 video.play().catch(function () {});
 document.body.removeEventListener('click', retry);
 }, { once: true });
 });
 }
 }

 if (video) {
 video.addEventListener('error', showVideoFallback);
 video.addEventListener('stalled', function () {
 if (video.readyState < 2) showVideoFallback();
 });
 video.addEventListener('loadeddata', function () {
 if (videoFallback) videoFallback.classList.remove('show');
 });
 tryPlayVideo();
 }

 function addGlitchBurst() {
 if (!glitchLayer) return;
 for (var i = 0; i < 3; i++) {
 (function (n) {
 setTimeout(function () {
 var b = document.createElement('div');
 b.style.position = 'absolute';
 b.style.left = Math.random() * 100 + '%';
 b.style.top = Math.random() * 100 + '%';
 b.style.width = (1 + Math.random() * 5) + '%';
 b.style.height = (1 + Math.random() * 3) + '%';
 b.style.background = Math.random() < 0.6 ? '#00ff00' : '#000';
 b.style.opacity = (0.22 + Math.random() * 0.32).toString();
 b.style.mixBlendMode = 'difference';
 b.style.zIndex = '22';
 b.style.pointerEvents = 'none';
 glitchLayer.appendChild(b);
 setTimeout(function () {
 b.style.transition = 'opacity 65ms linear';
 b.style.opacity = '0';
 setTimeout(function () { b.remove(); }, 55);
 }, 55);
 }, n * 16);
 })(i);
 }
 }

 /** Hard navigation - do not depend on CRT transition busy state */
 function enterLilyPad() {
 if (navigating) return;
 navigating = true;
 setStatus('ENTERING...');
 if (enterBtn) {
 enterBtn.disabled = true;
 enterBtn.textContent = 'ENTERING...';
 }

 // Prefer immediate assign; transition is optional polish only
 try {
 if (
 window.DOSWAPZ_TRANSITION &&
 typeof window.DOSWAPZ_TRANSITION.navigate === 'function'
 ) {
 window.DOSWAPZ_TRANSITION.navigate(DEST, { skipFade: true, delay: 0, preDelay: 0 });
 // Belt-and-suspenders if transition is stuck busy
 setTimeout(function () {
 if (location.pathname.indexOf('nodes') < 0) {
 window.location.assign(DEST);
 }
 }, 700);
 return;
 }
 } catch (err) {}

 window.location.assign(DEST);
 }

 // Expose for any leftover inline handlers
 window.enterLilyPad = enterLilyPad;

 if (enterBtn) {
 enterBtn.addEventListener('click', function (e) {
 e.preventDefault();
 e.stopPropagation();
 enterLilyPad();
 });
 // Pointer up also fires if :active transform ever fights click again
 enterBtn.addEventListener('pointerup', function (e) {
 if (e.button != null && e.button !== 0) return;
 // Only if click might have been lost - navigating guard prevents double
 });
 }

 setInterval(function () {
 if (Math.random() < 0.26) addGlitchBurst();
 }, 880);
 setTimeout(function () { addGlitchBurst(); }, 280);
 })();
 </script>
