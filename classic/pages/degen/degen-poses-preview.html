<!DOCTYPE html>
<html lang="en">
<head><script src="/assets/js/core/access-gate.js?v=20261016gate"></script> <meta charset="UTF-8"> <title>DEGEN - poses (characters only)</title> <style> * { box-sizing: border-box; } body { margin: 0; background: #1a1a1a; color: #fff; font-family: monospace; padding: 24px; } h1 { color: #f8d878; font-size: 20px; margin: 0 0 8px; } p { color: #a0a0a0; font-size: 14px; max-width: 760px; line-height: 1.5; margin: 0 0 20px; } .poses { display: flex; flex-wrap: wrap; gap: 14px; max-width: 900px; } .pose { background: #2a2a2a; border: 2px solid #444; padding: 8px; text-align: center; } .pose canvas { image-rendering: pixelated; display: block; margin: 0 auto 6px; } .pose span { font-size: 11px; color: #88ff88; font-weight: bold; } a { color: #88ff88; display: inline-block; margin-top: 20px; margin-right: 16px; } </style>
</head>
<body> <h1>DEGEN - all poses</h1> <p>Same labeled reference art. Background stripped. No stage.</p> <div class="poses" id="poses"></div> <a href="/classic/pages/degen/characters-preview.html"><- All characters</a> <a href="/classic/pages/degen/kol-fighter.html">Play game</a> <script src="/assets/js/degen/characters/character-extract.js"></script> <script src="/assets/js/degen/kol-fighter-nes.js"></script> <script src="/assets/js/degen/characters/degen-art.js"></script> <script src="/assets/js/degen/kol-fighter-sprites.js"></script> <script> const poseNames = ['idle', 'walk1', 'walk2', 'punch', 'kick', 'jump', 'crouch', 'hit']; const box = document.getElementById('poses'); KOL_FIGHTER_SPRITES.loadAll(() => { const sheet = KOL_FIGHTER_SPRITES.frames.degen; const scale = sheet._scale || 2.5; poseNames.forEach((name) => { const img = sheet[name]; if (!img) return; const wrap = document.createElement('div'); wrap.className = 'pose'; const c = document.createElement('canvas'); const sw = img.width * scale; const sh = img.height * scale; c.width = sw; c.height = sh; const cx = c.getContext('2d'); cx.imageSmoothingEnabled = false; cx.drawImage(img, 0, 0, sw, sh); wrap.appendChild(c); const label = document.createElement('span'); label.textContent = name.toUpperCase(); wrap.appendChild(label); box.appendChild(wrap); }); }); </script>
