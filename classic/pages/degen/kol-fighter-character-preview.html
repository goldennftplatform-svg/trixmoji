<body> <h1>DEGEN - FULL POSE LIST (L + R)</h1> <p>Your DEGEN art baked into every fighting pose. Player defaults to <strong>facing Right</strong>; CPU faces Left. Poses are canvas transforms from your single reference - replace with hand-drawn frames per pose when ready.</p> <div class="hero"> <canvas id="hero"></canvas> </div> <p id="status"></p> <div id="sections"></div> <a href="characters-preview.html"><- All characters</a> <a href="kol-fighter.html">Play game</a> <script src="../../../assets/js/degen/characters/pose-registry.js"></script> <script src="../../../assets/js/degen/characters/pose-bake.js"></script> <script src="../../../assets/js/degen/characters/character-extract.js"></script> <script src="../../../assets/js/degen/kol-fighter-nes.js"></script> <script src="../../../assets/js/degen/characters/degen-art.js"></script> <script src="../../../assets/js/degen/kol-fighter-sprites.js"></script> <script> const SCALE = 2.5; const sections = document.getElementById('sections'); const status = document.getElementById('status'); const GROUPS = [ { title: 'Idle & Facing', keys: ['idle'] }, { title: 'Movement', keys: ['walk'] }, { title: 'Air', keys: ['air'] }, { title: 'Block & Crouch', keys: ['block', 'crouch'] }, { title: 'Hit Reactions', keys: ['hurt'] }, { title: 'Win / Lose', keys: ['result'] }, { title: 'Attacks', keys: ['attack'] } ]; function drawScaled(canvas, src) { const sw = src.width * SCALE; const sh = src.height * SCALE; canvas.width = sw; canvas.height = sh; const cx = canvas.getContext('2d'); cx.imageSmoothingEnabled = false; cx.clearRect(0, 0, sw, sh); cx.drawImage(src, 0, 0, sw, sh); } function addPose(box, sheet, base, side) { const key = base + side; const frame = sheet[key]; if (!frame) return; const wrap = document.createElement('div'); wrap.className = 'pose'; const c = document.createElement('canvas'); drawScaled(c, frame); wrap.appendChild(c); const label = document.createElement('span'); label.textContent = (KOL_FIGHTER_POSES.LABELS[base] || base) + ' ' + side; wrap.appendChild(label); box.appendChild(wrap); } KOL_FIGHTER_SPRITES.loadDegen(function (ok) { if (!ok) { status.textContent = 'DEGEN load failed. Run OPEN-PREVIEW.bat from DOSWAPZ-v2.'; return; } const sheet = KOL_FIGHTER_SPRITES.frames.degen; if (!sheet || !sheet.idleR) { status.textContent = 'DEGEN sheet missing.'; return; } drawScaled(document.getElementById('hero'), sheet.idleR); GROUPS.forEach(function (grp) { const h = document.createElement('h2'); h.textContent = grp.title; sections.appendChild(h); const box = document.createElement('div'); box.className = 'poses'; sections.appendChild(box); const seen = {}; grp.keys.forEach(function (gk) { const list = KOL_FIGHTER_POSES.GROUPS[gk] || []; list.forEach(function (base) { if (seen[base]) return; seen[base] = true; addPose(box, sheet, base, 'R'); addPose(box, sheet, base, 'L'); }); }); }); status.textContent = 'Loaded ' + KOL_FIGHTER_POSES.frameKeys(false).length + ' frames from degen.jpg (v14).'; }); </script>
