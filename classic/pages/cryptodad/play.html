<script>
// ================== CRYPTO DAD - FULL REWRITE v3 ==================
// Dope Wars risk + Oregon Trail consequences + raw suburban dad survival

const terminal = document.getElementById('terminal');
const input = document.getElementById('commandInput');
const dadImage = document.getElementById('dadImage');

function updateGameImage(special = null) {
 if (!dadImage) return;

 let src = "/assets/images/cryptodad_colorful/11.jpg";

 if (special === "last_stand") {
 src = "/assets/images/cryptodad/last_stand.jpg";
 } else if (special === "game_over") {
 src = "/assets/images/cryptodad/game_over.jpg";
 } else if (special === "good_ending") {
 src = "/assets/images/cryptodad/good_ending.jpg";
 } else if (special === "heat_high") {
 src = "/assets/images/cryptodad/heat_high.jpg";
 } else if (gameState) {
 const f = gameState.family || 50;
 const h = gameState.heat || 0;

 if (f >= 80 && h < 25) src = "/assets/images/cryptodad_colorful/22.jpg"; // best
 else if (f >= 65 && h < 40) src = "/assets/images/cryptodad_colorful/18.jpg";
 else if (f >= 50 && h < 55) src = "/assets/images/cryptodad_colorful/12.jpg";
 else if (f < 30 || h > 70) src = "/assets/images/cryptodad_colorful/3.jpg"; // bad
 else if (h > 50) src = "/assets/images/cryptodad_colorful/7.jpg";
 else src = "/assets/images/cryptodad_colorful/14.jpg";
 }

 dadImage.src = src;
}

let currentMenu = "intro";
let inputLocked = false;

let gameState = {
 week: 0,

 liquid: 1250, // cash on hand
 savings: 0,
 tradingCash: 0, // "Crypto Wallet"

 morale: 100,
 family: 100,
 heat: 0,

 mode: 'realistic', // 'realistic' (harsh family decay, sim-validated) or 'arcade' (easier for fun runs)

 // Holdings (amount of coins)
 crypto: { BTC: 0, ETH: 0, SOL: 0, MEME: 0 },

 // Current prices (roughly real-world starting point May 2025 vibe)
 prices: {
 BTC: 104800,
 ETH: 2480,
 SOL: 152,
 MEME: 0.018
 },

 // Equipment
 firearm: false,
 armor: false,
 burner: false,

 // Life state
 inJail: false,
 jailWeeks: 0,
 jobLost: false,
 divorced: false,
 lostHouse: false,

 // History
 totalEarned: 0,
 arrests: 0,

 // In-game trading window per week (prevents infinite trade loops without advancing)
 tradeHoursUsed: 0
};

const MAX_TRADE_HOURS = 24;
const TRADE_HOUR_COST = {
 stable: 4,
 meme: 4,
 deposit: 1,
 withdraw: 1,
 sell: 3
};

// ================== UTILITIES ==================

function print(text, color = '#00ff41') {
 const line = document.createElement('div');
 line.className = 'line';
 line.style.color = color;
 line.textContent = text;
 terminal.appendChild(line);
 terminal.scrollTop = terminal.scrollHeight;
}

function clearTerminal() {
 terminal.innerHTML = '';
}

function delay(ms) {
 return new Promise(resolve => setTimeout(resolve, ms));
}

function fmt(n) {
 return Math.floor(n).toLocaleString();
}

function getCryptoValue() {
 return (gameState.crypto.BTC * gameState.prices.BTC) +
 (gameState.crypto.ETH * gameState.prices.ETH) +
 (gameState.crypto.SOL * gameState.prices.SOL) +
 (gameState.crypto.MEME * gameState.prices.MEME);
}

function totalNetWorth() {
 return gameState.liquid + gameState.savings + gameState.tradingCash + getCryptoValue();
}

function clamp(val, min, max) {
 return Math.max(min, Math.min(max, val));
}

function getTradeHoursRemaining() {
 return Math.max(0, MAX_TRADE_HOURS - (gameState.tradeHoursUsed || 0));
}

function formatTradeClock() {
 const remaining = getTradeHoursRemaining();
 const h = Math.floor(remaining);
 const m = Math.floor((remaining - h) * 60);
 return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

async function consumeTradeHours(hours, actionLabel) {
 const remaining = getTradeHoursRemaining();
 if (remaining <= 0) {
 print("⏱️ Your 24-hour trading window is CLOSED for this week.", "red");
 print("Markets don't wait forever. The week advances...", "yellow");
 await delay(420);
 await advanceWeek();
 return 'blocked';
 }
 if (hours > remaining) {
 print(`⏱️ Only ${formatTradeClock()} left - not enough time for ${actionLabel}.`, "red");
 print("You close the laptop. The week moves on.", "yellow");
 gameState.tradeHoursUsed = MAX_TRADE_HOURS;
 await delay(420);
 await advanceWeek();
 return 'exhausted';
 }

 gameState.tradeHoursUsed += hours;
 print(`⏱️ ${actionLabel} (~${hours}h) - ${formatTradeClock()} left in this week's window`, "gray");

 if (getTradeHoursRemaining() <= 0) {
 print("⏱️ 24-hour trading window EXHAUSTED. Week advances...", "yellow");
 await delay(500);
 await advanceWeek();
 return 'exhausted';
 }
 return 'ok';
}

// ================== FINAL SCORE + RUN END (auto-populate scoreboard) ==================

let gameEnded = false;

function calculateFinalScore() {
 // Heavily rewards keeping family and morale alive. Survival + net worth help.
 // Penalties for arrests, divorce, lost house, job loss, and high heat.
 let s = 0;

 s += Math.floor(gameState.family * 22); // family is the core
 s += Math.floor(gameState.morale * 11);
 s += Math.floor((gameState.week - 1) * 115); // weeks survived
 s += Math.floor(totalNetWorth() / 95);

 s -= gameState.arrests * 310;
 if (gameState.divorced) s -= 520;
 if (gameState.lostHouse) s -= 460;
 if (gameState.jobLost) s -= 220;

 // Heat drag at the end
 s -= Math.floor(gameState.heat * 4.5);

 // Good run bonus (low heat + strong family at the end)
 if (gameState.heat < 18 && gameState.family > 68) {
 s = Math.floor(s * 1.14);
 }

 // Mode scaling (arcade is a bit more forgiving on the high end for fun)
 if (gameState.mode === 'arcade') {
 s = Math.floor(s * 0.96);
 }

 // Reasonable bounds so it feels like a real score people want to sign
 s = Math.max(120, Math.min(12500, Math.floor(s)));
 return s;
}

function endRun(endingType) {
 if (gameEnded) return;
 gameEnded = true;

 const score = calculateFinalScore();
 const payload = {
 score: score,
 mode: gameState.mode || 'realistic',
 ts: new Date().toISOString().slice(0, 16).replace('T', ' '),
 ending: endingType || 'run_end'
 };

 localStorage.setItem('pending_score', JSON.stringify(payload));

 clearTerminal();
 print("════════════════════════════════════════", "yellow");
 print(" RUN COMPLETE", "yellow");
 print("════════════════════════════════════════", "yellow");
 print("");
 print(`FINAL SCORE: ${score}`, "yellow");
 print(`Mode: ${(gameState.mode || 'realistic').toUpperCase()}`, "white");
 print("");
 print("Redirecting to the scoreboard...", "cyan");
 print("You will be asked to log it with a soft signature (no funds, no tx permission).", "white");
 print("");

 // Short pause so the player sees the score, then go to the page that asks "log or not"
 setTimeout(() => {
 window.location.href = '/classic/pages/cryptodad/scoreboard.html';
 }, 1650);
}

// ================== MARKET (Dope Wars style swings) ==================

function updateMarket() {
 // Stable coins - realistic but still volatile
 gameState.prices.BTC *= (0.965 + Math.random() * 0.07);
 gameState.prices.ETH *= (0.96 + Math.random() * 0.08);
 gameState.prices.SOL *= (0.91 + Math.random() * 0.18);

 // Meme - pure chaos (Dope Wars energy)
 const memeRoll = Math.random();
 if (memeRoll < 0.11) {
 gameState.prices.MEME *= (0.04 + Math.random() * 0.12);
 print("💀 MEME RUG - the dev sold and deleted the telegram.", "red");
 } else if (memeRoll > 0.89) {
 gameState.prices.MEME *= (5 + Math.random() * 9);
 print("🚀 MEME MOONSHOT - some influencer posted it on X.", "yellow");
 } else if (memeRoll > 0.72) {
 gameState.prices.MEME *= (1.6 + Math.random() * 2.1);
 print("📈 Meme pumping hard on pure vibes.", "yellow");
 } else {
 gameState.prices.MEME *= (0.55 + Math.random() * 1.3);
 }

 // Global black swans
 const eventRoll = Math.random();
 if (eventRoll < 0.04) {
 gameState.prices.BTC *= 0.82;
 gameState.prices.ETH *= 0.79;
 print("🌍 WORLD EVENT: China cracks down again. Everything bleeds.", "red");
 } else if (eventRoll > 0.96) {
 gameState.prices.BTC *= 1.11;
 gameState.prices.ETH *= 1.09;
 print("🌍 WORLD EVENT: ETF approved / rate cut rumors. Green dildos.", "yellow");
 } else if (eventRoll > 0.93) {
 gameState.prices.SOL *= 0.71;
 print("🌍 WORLD EVENT: Solana network shits the bed for 6 hours.", "red");
 }

 // Hard floors and sanity caps
 gameState.prices.BTC = clamp(gameState.prices.BTC, 42000, 168000);
 gameState.prices.ETH = clamp(gameState.prices.ETH, 980, 6200);
 gameState.prices.SOL = clamp(gameState.prices.SOL, 38, 420);
 gameState.prices.MEME = clamp(gameState.prices.MEME, 0.0008, 4.8);
}

// ================== CONSEQUENCE ENGINE (the heart of the game) ==================

function applyWeeklyDecay() {
 // Passive family/morale drain if you don't spend time
 // Mode-aware: realistic is the harsh validated version from the 500k sims.
 // Arcade is gentler so more players can experience good endings while still having risk.
 const familyDecay = (gameState.mode === 'arcade') ? 3 : 6;
 gameState.family = clamp(gameState.family - familyDecay, 0, 100);
 gameState.morale = clamp(gameState.morale - 4, 0, 100);

 // Heat slowly bleeds if you lay low
 if (gameState.heat > 0) gameState.heat = clamp(gameState.heat - 2, 0, 100);
}

function randomFamilyIncident() {
 // Only triggers ~35% of weeks - feels rare and mean
 if (Math.random() > 0.35) return;

 const roll = Math.random();
 let cost = 0;
 let famHit = 0;
 let msg = "";

 if (roll < 0.09) {
 cost = 680; famHit = 4;
 msg = "🚽 Toilet exploded at 3am. Plumber wants $680 cash or he's not coming.";
 } else if (roll < 0.17) {
 cost = 2450; famHit = 12;
 msg = "🦷 Daughter needs braces. Orthodontist said \"or she can look like a shark\".";
 } else if (roll < 0.26) {
 cost = 1875; famHit = 7;
 msg = "🏠 Roof leak during the monsoon. Water pouring into the living room.";
 } else if (roll < 0.33) {
 cost = 290; famHit = 3;
 msg = "🐕 Dog ate your wife's AirPods... again. She is not amused.";
 } else if (roll < 0.41) {
 cost = 940; famHit = 9;
 msg = "📺 Your son spent $940 on \"limited edition\" Fortnite skins using your card.";
 } else if (roll < 0.49) {
 cost = 420; famHit = 6;
 msg = "🚗 Wife got a ticket for expired registration. She blames you.";
 } else if (roll < 0.56) {
 cost = 1350; famHit = 14;
 msg = "🏥 Kid broke his arm at soccer. Urgent care wants $1350 after insurance.";
 } else if (roll < 0.62) {
 cost = 780; famHit = 5;
 msg = "🔌 The whole breaker panel died. Electrician said \"your house is from 1978\".";
 } else {
 cost = 320; famHit = 4;
 msg = "📦 Amazon box came. It was not for you. Wife is now suspicious of everything.";
 }

 gameState.liquid = Math.max(0, gameState.liquid - cost);
 gameState.family = clamp(gameState.family - famHit, 0, 100);

 print(msg, "red");
 print(` -$${fmt(cost)} | Family -${famHit}%`, "gray");
}

function checkCriticalConsequences() {
 // HEAT consequences
 if (gameState.heat >= 92 && Math.random() < 0.55) {
 if (tryConsumePixelChicken('raid')) {
 // Chicken consumed - mitigated, lighter consequences
 } else {
 print("🚔 FED RAID. They kicked the door in at 6:12am.", "red");
 gameState.liquid = Math.floor(gameState.liquid * 0.35);
 gameState.tradingCash = Math.floor(gameState.tradingCash * 0.35);
 gameState.heat = 38;
 gameState.morale -= 22;
 gameState.family -= 15;
 print("They took everything they could find. You are lucky they didn't find the real stash.", "red");
 }
 }

 // Very high sustained heat - eventual game over
 if (gameState.heat >= 96) {
 print("🚨 The net is closing. You can't keep this up.", "red");
 updateGameImage("game_over");
 setTimeout(() => endRun('heat_burn'), 380);
 return true;
 }
 else if (gameState.heat >= 78 && Math.random() < 0.38) {
 if (!tryConsumePixelChicken('arrest')) {
 triggerArrest();
 return true;
 }
 // Chicken saved you this time - some heat reduction but no full arrest
 print("Close call. The rubber chicken bought you a little breathing room.", "yellow");
 }

 // FAMILY collapse
 if (gameState.family <= 18 && !gameState.divorced) {
 if (Math.random() < 0.65) {
 gameState.divorced = true;
 print("💔 She served you papers. \"You care more about your coins than your kids.\"", "red");
 gameState.family = 8;
 gameState.morale -= 35;
 gameState.liquid = Math.floor(gameState.liquid * 0.55);
 }
 }

 if (gameState.family <= 6 && !gameState.lostHouse) {
 gameState.lostHouse = true;
 print("🏚️ The bank foreclosed. Your family is moving in with her sister.", "red");
 updateGameImage("heat_high");
 gameState.morale -= 30;
 gameState.heat += 25; // stress makes you sloppy
 }

 // Terminal family death - end the run and send score to scoreboard
 if (gameState.family <= 2) {
 print("💀 Your family is gone. There is nothing left to come home to.", "red");
 updateGameImage("game_over");
 setTimeout(() => endRun('family_collapse'), 420);
 return true;
 }

 // Morale death spiral
 if (gameState.morale <= 12) {
 print("🪦 You haven't smiled in weeks. Your kids don't recognize you anymore.", "red");
 gameState.family = clamp(gameState.family - 8, 0, 100);
 }

 return false;
}

function triggerArrest() {
 gameState.arrests++;
 gameState.heat = Math.max(25, gameState.heat - 30);
 gameState.inJail = true;
 gameState.jailWeeks = 0;

 clearTerminal();
 print("🚔 YOU GOT BUSTED.", "red");
 print("Two detectives and a K9 unit showed up at the house.", "red");
 print("");
 print("They found the burner and three ounces in the shed.", "red");
 print("");

 if (gameState.firearm) {
 print("You had the revolver. It made things... complicated.", "yellow");
 gameState.heat += 18;
 }

 print("You are now in county lockup.", "red");
 print("");
 print("What do you want to do?", "cyan");
 print("1. BETTER CALL SOL (expensive lawyer - $4200, heat stays high but you walk fast)");
 print("2. HAVE FAMILY BAIL YOU OUT (costs money + family trust)");
 print("3. TAKE THE DEAL / SERVE TIME (cheaper fine, but many weeks + lose job)");
 print("4. FIGHT IT IN COURT (risky - 50/50 you get more time or walk)");

 currentMenu = "jail";
}

// ================== WEEK ADVANCE ==================

async function advanceWeek() {
 currentMenu = "processing";
 gameState.week++;
 gameState.tradeHoursUsed = 0;
 updateGameImage();

 print("");
 print(`========= WEEK ${gameState.week} ========`, "white");

 // Paycheck / bills
 if (!gameState.jobLost && !gameState.inJail) {
 gameState.liquid += 1180;
 print("💵 Paycheck landed: +$1,180", "green");
 } else if (gameState.jobLost) {
 print("💼 No paycheck. You lost your job.", "red");
 }

 // Positive long-term ending: survive long enough with the family mostly intact and heat low
 if (gameState.week >= 13 && gameState.family > 64 && gameState.heat < 28 && !gameEnded) {
 print("🌅 You made it. The heat is manageable. The family is still here.", "yellow");
 updateGameImage("good_ending");
 setTimeout(() => endRun('good_ending'), 520);
 return;
 }

 gameState.liquid -= 920;
 print("🏠 Bills + groceries: -$920", "red");

 // Market moves
 updateMarket();

 // Random family disasters (not every week)
 randomFamilyIncident();

 // Passive decay
 applyWeeklyDecay();

 // Heat from previous risky behavior
 if (gameState.heat > 55 && Math.random() < 0.22) {
 print("👮 Someone is asking questions about you at the bar.", "red");
 gameState.heat += 8;
 }

 // Critical checks
 const arrested = checkCriticalConsequences();
 if (arrested) return;

 // Show state
 showStats();

 // Chance of random police encounter if heat is high
 if (gameState.heat > 68 && Math.random() < 0.28 && !gameState.inJail) {
 await policeEncounter();
 return;
 }

 currentMenu = "main";
 await showMainMenu();
}

// ================== STATS DISPLAY ==================

function showStats() {
 const cryptoVal = getCryptoValue();

 print("────────────────────────────────────", "white");
 print(`WEEK ${gameState.week} | NET WORTH: $${fmt(totalNetWorth())}`, "white");
 print(`LIQUID: $${fmt(gameState.liquid)} SAVINGS: $${fmt(gameState.savings)}`, "white");

 }
 else if (cmd === "5") {
 print("Sell what % of your current holdings? (2% fee)");
 currentMenu = "trade-sell";
 }
 else if (cmd === "0") await showMainMenu();
 return;
 }

 if (currentMenu === "trade-stable") { await executeStableBuy(parseFloat(cmd) || 0); return; }
 if (currentMenu === "trade-meme") { await executeMemeBuy(parseFloat(cmd) || 0); return; }
 if (currentMenu === "trade-deposit") { await transferLiquidToCryptoWallet(parseFloat(cmd) || 0); return; }
 if (currentMenu === "trade-withdraw"){ await transferCryptoWalletToLiquid(parseFloat(cmd) || 0); return; }
 if (currentMenu === "trade-sell") { await sellHoldings(parseFloat(cmd) || 0); return; }

 // ================= HUSTLE =================
 if (currentMenu === "hustle") {
 if (cmd === "1") await cardPulls(); // Legal
 else if (cmd === "2") await uber(); // Legal
 else if (cmd === "3") await sellDrugs(); // Illegal
 else if (cmd === "4") await opportunityKnocks(); // Illegal (Boost & Pawn)
 else if (cmd === "0") await showMainMenu();
 return;
 }
 if (currentMenu === "card-pulls-amount") {
 let amt = parseFloat(cmd);
 if (cmd.includes("%")) amt = gameState.liquid * (parseFloat(cmd) / 100);
 await doCardPulls(Math.floor(amt));
 return;
 }
 if (currentMenu === "opportunity") {
 const n = parseInt(cmd);
 if ([1,2,3].includes(n)) await resolveOpportunity(n);
 else await hustleMenu();
 return;
 }

 // ================= FAMILY =================
 if (currentMenu === "family") {
 const n = parseInt(cmd);
 if ([1,2,3,4].includes(n)) await doFamilyAction(n);
 else if (cmd === "0") await showMainMenu();
 return;
 }

 // ================= BANK =================
 if (currentMenu === "bank") {
 if (cmd === "1") { print("Deposit what % of liquid?"); currentMenu = "bank-deposit"; }
 else if (cmd === "2") { print("Withdraw what % of savings?"); currentMenu = "bank-withdraw"; }
 else if (cmd === "0") await showMainMenu();
 return;
 }
 if (currentMenu === "bank-deposit") { await doDeposit(parseFloat(cmd) || 0); return; }
 if (currentMenu === "bank-withdraw") { await doWithdraw(parseFloat(cmd) || 0); return; }

 // ================= STORE =================
 if (currentMenu === "store") {
 const n = parseInt(cmd);
 if ([1,2,3].includes(n)) await buyFromStore(n);
 else if (cmd === "0") await showMainMenu();
 return;
 }
}

async function startGame() {
 currentMenu = "main";

 print("================================================", "yellow");

}

// ================== INPUT HANDLING ==================

input.addEventListener('keydown', async function(e) {
 if (e.repeat) { e.preventDefault(); return; }
 if (e.key !== 'Enter') return;

 e.preventDefault();
 if (inputLocked || currentMenu === 'processing') return;

 inputLocked = true;
 const val = input.value;
 input.value = '';

 try {
 await handleCommand(val);
 } finally {
 setTimeout(() => { inputLocked = false; }, 180);
 }
});

// ================== BOOT ==================

window.onload = () => {
 clearTerminal();

 print("================================================", "yellow");
 print(" CRYPTO DAD", "yellow");
 print("================================================", "yellow");
 print("");
 print("HIT ENTER TO START", "yellow");
 print("");
 print("INSTRUCTIONS:", "cyan");
 print("Type the NUMBER of your choice and press ENTER.", "white");
 print("Balance FAMILY, HEAT, and MONEY.", "white");
 print("TRADE has a 24-hour in-game window per week - then time advances.", "cyan");
 print("Too much HEAT brings the police.", "red");
 print("Ignore your FAMILY and you will lose everything.", "red");
 print("When a run ends you will be sent to the scoreboard to decide whether to log the score (soft sign only).", "cyan");
 print("");
 print("Dry. Raw. Suburban. Dangerous.", "gray");

 currentMenu = "intro";
 input.focus();
};

// Toasty head pop-up (head-only cropped image, retro corner easter egg)
const CRYPTODAD_SELL_TOKEN_URL = '/classic/pages/cryptodad/token.html';
let toastyHideTimer = null;

function triggerToasty() {
 const img = document.getElementById('toasty');
 const label = document.getElementById('toastyText');
 if (!img || !label) return;

 if (toastyHideTimer) {
 clearTimeout(toastyHideTimer);
 toastyHideTimer = null;
 }

 img.classList.remove('show', 'hide');
 label.classList.remove('show');

 void img.offsetWidth; // reflow

 label.textContent = 'CLICK -> BUY';
 img.classList.add('show');
 label.classList.add('show');

 const openSellerToken = () => {
 window.open(CRYPTODAD_SELL_TOKEN_URL, '_blank', 'noopener,noreferrer');
 };

 const onClick = () => openSellerToken();
 img.addEventListener('click', onClick);
 label.addEventListener('click', onClick);

 const hideToasty = () => {
 img.removeEventListener('click', onClick);
 label.removeEventListener('click', onClick);
 img.classList.remove('show');
 img.classList.add('hide');
 label.classList.remove('show');
 setTimeout(() => {
 img.classList.remove('hide');
 label.textContent = 'TOASTY!';
 }, 300);
 };

 toastyHideTimer = setTimeout(() => {
 hideToasty();
 toastyHideTimer = null;
 }, 7000);
}

// ================== SECRET PIXEL / LOST EPISODE TEST RUN ==================
// Pure luck discovery (Homestar Runner style): tiny specific pixel in the visual pane.
// No hints, no big cursor change. Found only by obsessive hovering/clicking.
// Press '[' while the game is running to temporarily highlight the spot for testing.

let secretPixelFoundThisRun = false;

function initSecretPixel() {
 const pixel = document.getElementById('secretPixel');
 const img = document.getElementById('dadImage');
 if (!pixel || !img) return;

 pixel.addEventListener('click', (e) => {
 e.stopPropagation();
 if (secretPixelFoundThisRun || !gameState || currentMenu === 'intro') return;
 triggerSecretPixelAnimation();
 });

 // Dev helper for this test run only: '[' highlights the pixel briefly so you can demo the animation easily.
 document.addEventListener('keydown', (e) => {
 if (e.key === '[' && pixel && img && gameState && currentMenu !== 'intro') {
 pixel.classList.add('highlight');
 setTimeout(() => {
 if (pixel) pixel.classList.remove('highlight');
 }, 2200);
 }
 });
}

async function triggerSecretPixelAnimation() {
 const pixel = document.getElementById('secretPixel');
 const img = document.getElementById('dadImage');
 if (!img || secretPixelFoundThisRun) return;

 secretPixelFoundThisRun = true;
 if (pixel) pixel.style.pointerEvents = 'none';

 const prevSrc = img.src;

 print("");
 print(">>> STATIC BREAK <<<", "yellow");
 print("You caught it. A single pixel in the image didn't belong.", "white");
 await sleep(650);

 // Family photo glitch sequence (using mint portraits + colorful frames)
 img.src = "/assets/images/cryptodad_mint/kid1_portrait.jpg";
 print("The kid's face flickered for a frame.", "cyan");
 await sleep(520);

 img.src = "/assets/images/cryptodad_mint/mom_portrait.jpg";
 print("She was already looking at the corner of the frame.", "cyan");
 await sleep(520);

 img.src = "/assets/images/cryptodad_mint/dad_portrait.jpg";
 print("You. Holding something that wasn't there the week before.", "cyan");
 await sleep(520);

 // Toasty cameo at the peak
 triggerToasty();
 print("TOASTY", "yellow");
 await sleep(400);

 img.src = "/assets/images/cryptodad/heat_high.jpg";
 print("The heat spiked for no reason the sim could explain.", "red");
 await sleep(480);

 img.src = "/assets/images/cryptodad_colorful/7.jpg";
 print("Then the photo glitched into one of the runs that never got logged.", "white");
 await sleep(480);

 img.src = "/assets/images/cryptodad/last_stand.jpg";
 print("You remember this one. The night the numbers stopped making sense.", "red");
 await sleep(520);

 img.src = "/assets/images/cryptodad/good_ending.jpg";
 print("It resolved into the ending you never chose.", "green");
 await sleep(650);

 // Reward: a random item "glitched in" from the store (pixel-only luck)
 // Weighted: Burner is most common. Rubber Chicken is the special pixel-exclusive one-time item.
 const secretPool = [
 { name: "Revolver (.38)", flag: "firearm", weight: 25, isOneTime: false,
 msg: "🔫 A .38 phased out of the static. Let's hope the pixel wasn't a warning.",
 effect: () => { gameState.firearm = true; } },
 { name: "Level III Body Armor", flag: "armor", weight: 15, isOneTime: false,
 msg: "🦺 Plates blinked into existence. First raid just got a lot less final.",
 effect: () => { gameState.armor = true; } },
 { name: "Burner Phone + 6 months", flag: "burner", weight: 45, isOneTime: false,
 msg: "📱 New number clawed its way out of the noise. Old one is gone.",
 effect: () => { gameState.burner = true; gameState.heat = clamp(gameState.heat - 12, 0, 100); } },
 { name: "Rubber Chicken (Lucky)", flag: "pixelChicken", weight: 15, isOneTime: true,
 msg: "🐔 A rubber chicken tumbled out of the glitch. One-time use only.",
 effect: () => { gameState.pixelChicken = true; } }
 ];

 function pickWeightedSecret() {
 const total = secretPool.reduce((s, i) => s + i.weight, 0);
 let r = Math.random() * total;
 for (const it of secretPool) {
 r -= it.weight;
 if (r <= 0) return it;
 }
 return secretPool[secretPool.length - 1];
 }

 let chosen = pickWeightedSecret();

 // No dupes for permanent gear. For the one-time chicken, if already granted this run (shouldn't happen), fallback.
 const alreadyOwned = gameState && (
 (chosen.flag === "firearm" && gameState.firearm) ||
 (chosen.flag === "armor" && gameState.armor) ||
 (chosen.flag === "burner" && gameState.burner) ||
 (chosen.flag === "pixelChicken" && gameState.pixelChicken)
 );

 if (gameState) {
 if (alreadyOwned) {
 gameState.liquid = (gameState.liquid || 0) + 380;
 gameState.heat = clamp((gameState.heat || 0) - 8, 0, 100);
 print("");
 print("SECRET PIXEL CLAIMED", "yellow");
 print("The static owed you. +$380 liquid * Heat -8", "green");
 } else {
 chosen.effect();
 print("");
 print("SECRET PIXEL CLAIMED - " + chosen.name, "yellow");
 print(chosen.msg, "green");
 }

 // Small universal "the glitch was kind" bump (always)
 gameState.family = Math.min(100, (gameState.family || 50) + 12);
 gameState.morale = Math.min(100, (gameState.morale || 50) + 10);
 }

 print("Family +12 * Morale +10 (the image is a little kinder now)", "cyan");
 print("(Pure chance. No hints. Tell no one where the pixel was.)", "gray");

 await sleep(420);
 img.src = prevSrc || "/assets/images/cryptodad_colorful/11.jpg";

 // Let the normal updateGameImage logic take over again on next week
 if (typeof updateGameImage === 'function') {
 // small delay so the reward text settles, then let state drive the image
 setTimeout(() => {
 if (typeof updateGameImage === 'function') updateGameImage();
 }, 650);
 }
}

// Small helper used by the secret animation (non-blocking sleep)
function sleep(ms) {
 return new Promise(resolve => setTimeout(resolve, ms));
}

// One-time use pixel reward item (Rubber Chicken) consumption helper.
// Call this before bad events. Returns true if it consumed the chicken and mitigated.
function tryConsumePixelChicken(reason) {
 if (!gameState || !gameState.pixelChicken) return false;
 gameState.pixelChicken = false;

 if (reason === 'raid') {
 print("🐔 The rubber chicken went off like a car alarm in the next room. The agents looked at each other and left.", "yellow");
 gameState.heat = clamp(gameState.heat - 30, 0, 100);
 gameState.morale = clamp(gameState.morale + 12, 0, 100);
 } else if (reason === 'arrest') {
 print("🐔 You squeezed the rubber chicken at the last second. The K9 unit started playing with it instead of you.", "yellow");
 gameState.heat = clamp(gameState.heat - 18, 0, 100);
 } else {
 print("🐔 The rubber chicken intervened. Luck shifted in your favor.", "yellow");
 gameState.heat = clamp(gameState.heat - 15, 0, 100);
 }
 return true;
}

// Boot the secret pixel listener (called from the existing window.onload area)
initSecretPixel();
