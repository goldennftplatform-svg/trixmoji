<!doctype html>
<html lang="en">
<head><script src="/assets/js/core/access-gate.js?v=20261016gate"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOMS</title>
<meta name="description" content="MOMS. Ten levels. She is the one you have to drop.">
<style>
html,body{margin:0;background:#000;color:#9a9a9a;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100%;height:100dvh;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{flex:1 1 auto;min-width:0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
canvas{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
#help{flex:0 0 auto;width:100%;box-sizing:border-box;padding:4px 8px 6px;text-align:center;color:#6e6e6e;font:11px/1.35 ui-monospace,monospace;letter-spacing:.03em}
#help a{color:#bdbdbd;text-decoration:none}
#help a:hover{color:#fff}
#touch{display:none}
#report{position:absolute;left:4px;top:4px;margin:0;color:#7dff9a;font:10px/1.3 ui-monospace,monospace;z-index:4;max-width:70%;white-space:pre-wrap}
@media (pointer:coarse), (max-width: 700px){
  #touch{display:flex;position:absolute;left:0;right:0;bottom:0;height:46%;justify-content:space-between;align-items:flex-end;padding:10px;box-sizing:border-box;pointer-events:none;z-index:3}
  #stick{pointer-events:auto;width:min(128px,28vw);height:min(128px,28vw);border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.28);position:relative;touch-action:none;flex:0 0 auto}
  #nub{width:40%;height:40%;border-radius:50%;background:rgba(255,48,32,.55);position:absolute;left:30%;top:30%}
  #btns{pointer-events:auto;display:flex;gap:8px;align-items:flex-end;flex:0 1 auto}
  #btns button{width:min(76px,17vw);height:min(76px,17vw);border-radius:50%;border:2px solid #ff3a2a;background:rgba(70,0,0,.5);color:#fff;font:13px/1 ui-monospace,monospace;touch-action:none}
  #touch #btn-fire{width:min(92px,21vw);height:min(92px,21vw);background:rgba(140,10,0,.55)}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="g" width="400" height="250"></canvas>
  <div id="touch">
    <div id="stick" aria-label="Move"><div id="nub"></div></div>
    <div id="btns">
      <button type="button" id="btn-gun">GUN</button>
      <button type="button" id="btn-use">USE</button>
      <button type="button" id="btn-fire">FIRE</button>
    </div>
  </div>
  <pre id="report" hidden></pre>
</div>
<div id="help"><a href="/classic/pages/arcade/hub.html">ARCADE</a> &nbsp;·&nbsp; MOMS &nbsp;·&nbsp; WASD MOVE &nbsp;·&nbsp; ARROWS OR MOUSE TURN &nbsp;·&nbsp; HOLD CLICK OR CTRL TO FIRE &nbsp;·&nbsp; E OR SPACE OPENS &nbsp;·&nbsp; 1-6 WEAPONS &nbsp;·&nbsp; SHIFT RUN &nbsp;·&nbsp; TAB MAP &nbsp;·&nbsp; R RETRY</div>
<script src="/classic/pages/arcade/moms/game.js?v=20261006moms3"></script>
</body>
</html>
