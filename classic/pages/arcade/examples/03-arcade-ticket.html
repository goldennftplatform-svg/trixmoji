<!DOCTYPE html>
<html lang="en">
<head><script src="/assets/js/core/access-gate.js?v=20261016gate"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Example 3 — Arcade Ticket Stub</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #050805;
      color: #33ff66;
      font-family: VT323, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .badge { color: #ffd700; letter-spacing: 3px; font-size: 14px; margin-bottom: 14px; }
    .ticket {
      width: min(340px, 100%);
      background: #0a140c;
      border: 2px dashed #1a9944;
      padding: 0;
      position: relative;
      box-shadow: 0 0 24px rgba(51, 255, 102, 0.12);
    }
    .ticket::before, .ticket::after {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      background: #050805;
      border-radius: 50%;
      left: -10px;
    }
    .ticket::before { top: 40%; }
    .ticket::after { bottom: 30%; }
    .head {
      padding: 14px 18px 10px 28px;
      border-bottom: 1px dashed #1a9944;
      letter-spacing: 3px;
      color: #00ffcc;
      font-size: 20px;
    }
    .body { padding: 14px 18px 18px 28px; font-size: 20px; line-height: 1.5; }
    .body strong { color: #ffd700; }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    .stamp {
      margin-top: 12px;
      display: inline-block;
      border: 2px solid #ff4da6;
      color: #ff7ac8;
      padding: 4px 10px;
      letter-spacing: 2px;
      transform: rotate(-6deg);
      font-size: 18px;
    }
    p.note { margin-top: 14px; color: #1a9944; font-size: 16px; text-align: center; max-width: 360px; }
    nav { margin-top: 14px; font-size: 16px; }
    nav a { color: #00ffcc; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="badge">EXAMPLE 03 / 05 · SHAREABLE TICKET</div>
  <div class="ticket">
    <div class="head">DOSWAPZ ARCADE ★ TICKET</div>
    <div class="body">
      <div class="row"><span>CABINET</span><strong>PINK FROG</strong></div>
      <div class="row"><span>SCORE</span><strong>12,450</strong></div>
      <div class="row"><span>LEVEL</span><strong>4</strong></div>
      <div class="row"><span>PLAYER</span><strong>@DEGEN</strong></div>
      <div class="row"><span>DATE</span><strong>2026-07-19</strong></div>
      <div class="row"><span>SEED</span><strong>+DAILY a3f91c</strong></div>
      <div class="stamp">VALID RUN</div>
    </div>
  </div>
  <p class="note">Idea: after a run, generate a stub like this to copy / post to X.</p>

</body>
</html>
