<!DOCTYPE html>
<html lang="en">
<head><script src="/assets/js/core/access-gate.js?v=20261016gate"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Example 2 — PINK FROG Playfield</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #12080e;
      color: #ffe0f0;
      font-family: VT323, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .badge { color: #ff7ac8; letter-spacing: 3px; font-size: 14px; margin: 8px 0 12px; }
    canvas {
      border: 3px solid #ff4da6;
      box-shadow: 4px 4px 0 #0a0408;
      image-rendering: pixelated;
      max-width: 100%;
      background: #1a0a14;
    }
    p { margin-top: 12px; font-size: 18px; color: #ffb3d9; max-width: 420px; text-align: center; }
    nav { margin-top: 14px; font-size: 16px; }
    nav a { color: #ff7ac8; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="badge">EXAMPLE 02 / 05 · PLAYFIELD MOCK</div>
  <canvas id="c" width="416" height="448"></canvas>
  <p>Static mock of lanes: homes → river → road → start. Pink frog waiting to hop.</p>
  <nav>
    <a href="01-pink-frog-title.html">← Prev</a>
    <a href="index.html">All</a>
    <a href="03-arcade-ticket.html">Next →</a>
  </nav>
  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    const T = 32, COLS = 13, ROWS = 14;
    const HOME = [1, 3, 5, 7, 9];
    for (let r = 0; r < ROWS; r++) {
      const y = r * T;
      if (r === 0) {
        ctx.fillStyle = "#5a1848";
        ctx.fillRect(0, y, COLS * T, T);
        for (let col = 0; col < COLS; col++) {
          if (HOME.includes(col)) {
            ctx.fillStyle = "#2a8030";
            ctx.beginPath();
            ctx.ellipse(col * T + 16, y + 16, 12, 10, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = "#3a1040";
            ctx.fillRect(col * T, y, T, T);
            ctx.fillStyle = "#ff4da6";
            ctx.fillRect(col * T + 10, y + 12, 6, 6);
          }
        }
      } else if (r >= 1 && r <= 5) {
        ctx.fillStyle = r % 2 ? "#4a1878" : "#3a1060";
        ctx.fillRect(0, y, COLS * T, T);
      } else if (r === 6 || r >= 12) {
        ctx.fillStyle = "#4a2048";
        ctx.fillRect(0, y, COLS * T, T);
        ctx.fillStyle = "#ff7ac8";
        ctx.fillRect(0, y, COLS * T, 3);
      } else {
        ctx.fillStyle = "#1a1420";
        ctx.fillRect(0, y, COLS * T, T);
        ctx.fillStyle = "#ff4da6";
        for (let col = 0; col < COLS; col += 2) ctx.fillRect(col * T + 4, y + 15, 12, 2);
      }
    }
    // fake cars
    [[7, 40, "#ff69b4"], [8, 200, "#ff1493"], [9, 100, "#ff4da6"], [10, 280, "#e040a0"], [11, 60, "#ff7ac8"]].forEach(([r, x, col]) => {
      ctx.fillStyle = col;
      ctx.fillRect(x, r * T + 8, 48, 16);
    });
    // logs
    [[2, 30], [4, 120], [5, 250]].forEach(([r, x]) => {
      ctx.fillStyle = "#8b4518";
      ctx.fillRect(x, r * T + 6, 96, 20);
    });
    // frog bottom
    const fx = 6 * T, fy = 13 * T;
    ctx.fillStyle = "#ff4da6";
    ctx.fillRect(fx + 6, fy + 8, 20, 16);
    ctx.fillStyle = "#ff7ac8";
    ctx.fillRect(fx + 8, fy + 2, 16, 10);
    ctx.fillStyle = "#1a0a14";
    ctx.fillRect(fx + 10, fy + 4, 3, 3);
    ctx.fillRect(fx + 19, fy + 4, 3, 3);
  </script>
</body>
</html>
