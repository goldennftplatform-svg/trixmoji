<!DOCTYPE html>
<html lang="en">
<head><script src="/assets/js/core/access-gate.js?v=20261016gate"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Example 4 — GEOFF Boot Ending</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Nunito:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #121820;
      color: #f0f4f8;
      font-family: Nunito, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .badge {
      font-family: Orbitron, monospace;
      color: #5ce090;
      letter-spacing: 3px;
      font-size: 12px;
      margin-bottom: 14px;
    }
    .panel {
      width: min(420px, 100%);
      background: #1a2434;
      border: 3px solid #3a5068;
      box-shadow: 5px 5px 0 #0a0e14;
      padding: 24px 20px;
      text-align: center;
    }
    .hero { font-size: 3rem; margin-bottom: 6px; }
    h1 {
      font-family: Orbitron, monospace;
      font-size: 1.2rem;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .sub { color: #5ce090; margin-bottom: 14px; font-size: 0.95rem; }
    .boot {
      background: #060c10;
      border: 2px solid #2a5040;
      text-align: left;
      padding: 12px 14px;
      min-height: 180px;
      margin-bottom: 12px;
    }
    #log {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      color: #5ce090;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .cursor {
      display: inline-block;
      width: 8px; height: 13px;
      background: #5ce090;
      animation: blink 0.8s steps(1) infinite;
      vertical-align: text-bottom;
    }
    @keyframes blink { 50% { opacity: 0; } }
    nav { margin-top: 16px; font-size: 15px; font-family: Orbitron, monospace; }
    nav a { color: #5cb8e0; margin: 0 8px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="badge">EXAMPLE 04 / 05 · SNOWMAN BUILDZ GEOFF ENDING</div>
  <div class="panel">
    <div class="hero">⛄</div>
    <h1>GEOFF IS ONLINE</h1>
    <p class="sub">What you see after you finish all 6 levels</p>
    <div class="boot"><pre id="log"></pre></div>
  </div>
  <nav>
    <a href="03-arcade-ticket.html">← Prev</a>
    <a href="index.html">All</a>
    <a href="05-daily-cabinet.html">Next →</a>
  </nav>
  <script>
    const lines = [
      "> GEOFF BOOT SEQUENCE v1.0",
      "> PSU 850W ONLINE",
      "> MOBO ATX DETECTED",
      "> CPU @ 9.2 THz",
      "> RAM 2TB CRYO OK",
      "> GPU CLUSTER LINKED",
      "> COOLING: 0 K",
      "> ALL SYSTEMS NOMINAL",
      "> SUPERCOMPUTER ONLINE",
      "> HELLO, SNOWMAN. I AM GEOFF.",
    ];
    const log = document.getElementById("log");
    let i = 0;
    function tick() {
      if (i < lines.length) {
        log.textContent += lines[i] + "\n";
        i++;
        setTimeout(tick, 320);
      } else {
        log.innerHTML = log.textContent + '<span class="cursor"></span>';
      }
    }
    tick();
  </script>
</body>
</html>
