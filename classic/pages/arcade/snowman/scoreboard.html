<!DOCTYPE html>
<html lang="en">
<head><script src="/assets/js/core/access-gate.js?v=20261016gate"></script>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
 <title>SNOWMAN / GEOFF SCORES</title>
 <meta name="description" content="GEOFF soft scores">
 <link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@600&display=swap" rel="stylesheet">
 <style>
 :root {
 --ice: #a8e0ff; --geoff: #7cffb2; --dim: #5a8098; --gold: #ffd700; --bg: #0a1628;
 }
 * { box-sizing: border-box; margin: 0; padding: 0; }
 html, body {
 min-height: 100%;
 background: radial-gradient(ellipse at 50% 0%, rgba(92,225,255,0.1), transparent 55%), var(--bg);
 color: var(--ice);
 font-family: VT323, monospace;
 }
 .wrap { max-width: 800px; margin: 0 auto; padding: 16px 12px 48px; }
 input { font-size: 16px !important; min-height: 44px; }
 button, .btn { min-height: 44px; padding: 10px 14px; }
 .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
 table { min-width: 520px; }
 h1 {
 font-family: Orbitron, monospace;
 font-size: clamp(14px, 3.5vw, 20px);
 letter-spacing: 0.06em;
 color: var(--geoff);
 text-align: center;
 margin-bottom: 6px;
 }
 .sub { text-align: center; color: var(--dim); letter-spacing: 2px; margin-bottom: 8px; font-size: 16px; }
 .note { text-align: center; color: #3a5068; font-size: 14px; margin-bottom: 16px; }
 .daily, .soft {
 border: 2px solid #2a4860;
 background: rgba(10, 28, 48, 0.9);
 padding: 12px 14px;
 margin-bottom: 12px;
 }
 .daily { text-align: center; }
 .daily strong { color: var(--gold); letter-spacing: 2px; }
 .daily .seed { color: var(--ice); font-size: 22px; letter-spacing: 2px; margin-top: 4px; }
 .soft {
 display: grid;
 grid-template-columns: 1fr 1fr auto;
 gap: 8px;
 align-items: end;
 }
 @media (max-width: 620px) { .soft { grid-template-columns: 1fr; } }
 label { display: block; font-size: 12px; color: var(--dim); letter-spacing: 2px; margin-bottom: 3px; }
 input {
 width: 100%; background: #061018; border: 1px solid #2a4860; color: var(--ice);
 font: inherit; font-size: 18px; padding: 8px 10px;
 }
 button, .btn {
 font: inherit; letter-spacing: 2px; cursor: pointer; border: 1px solid var(--geoff);
 background: transparent; color: var(--geoff); padding: 8px 12px; text-decoration: none; display: inline-block;
 }
 button:hover, .btn:hover { background: var(--geoff); color: #061018; }
 .stats {
 display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
 }
 @media (max-width: 620px) { .stats { grid-template-columns: 1fr 1fr; } }
 .stat {
 border: 1px solid #2a4860; background: #0c1c30; padding: 10px 8px; text-align: center;
 }
 .stat .l { color: var(--dim); font-size: 12px; letter-spacing: 2px; }
 .stat .v { color: var(--gold); font-size: 22px; margin-top: 4px; }
 .stat .v.geoff { color: var(--geoff); }
 table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 16px; }
 th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid #1a3048; }
 th { color: var(--dim); letter-spacing: 1px; font-weight: normal; font-size: 12px; }
 tr.me td { color: var(--gold); }
 tr.geoff-row td { color: var(--geoff); }
 .badge {
 display: inline-block; font-size: 11px; letter-spacing: 1px; padding: 1px 6px;
 border: 1px solid var(--geoff); color: var(--geoff); margin-left: 4px;
 }
 .nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
 .share {
 border: 1px solid #2a4860; background: rgba(8, 20, 36, 0.9); padding: 12px; margin-top: 8px;
 }
 .share pre { white-space: pre-wrap; color: #7a9ab0; font: inherit; font-size: 15px; margin: 8px 0 12px; }
 .status { min-height: 18px; text-align: center; color: var(--dim); font-size: 14px; margin-top: 8px; }
 </style>
</head>
<body>
 <div class="wrap">
 <h1>SNOWMAN / GEOFF</h1>
 <div class="sub">SOFT SCORES</div>

 <div class="daily">
 <strong>DAILY</strong>
 <div id="dailyMode">—</div>
 <div class="seed" id="dailySeed">—</div>
 <div style="color:var(--dim);font-size:13px;margin-top:4px" id="dailyDay"></div>
 </div>

 <div class="soft">
 <div>
 <label for="scHandle">@HANDLE</label>
 <input id="scHandle" placeholder="@you" maxlength="16" autocomplete="off">
 </div>
 <div>
 <label for="scAlias">ALIAS</label>
 <input id="scAlias" placeholder="DEGEN" maxlength="12" autocomplete="off">
 </div>
 <button type="button" id="scSave">SAVE SOFT</button>
 </div>

 <div class="stats">
 <div class="stat"><div class="l">BEST SCORE</div><div class="v" id="statBest">—</div></div>
 <div class="stat"><div class="l">GEOFF 100%</div><div class="v geoff" id="statGeoff">0</div></div>
 <div class="stat"><div class="l">ENTRIES</div><div class="v" id="statN">0</div></div>
 <div class="stat"><div class="l">YOUR TAG</div><div class="v" id="statTag" style="font-size:15px">—</div></div>
 </div>

 <div class="table-wrap">
 <table>
 <thead>
 <tr>
 <th>#</th>
 <th>PLAYER</th>
 <th>SCORE</th>
 <th>GEOFF</th>
 <th>KILLS</th>
 <th>PARTS</th>
 <th>🥕</th>
 <th>SEED</th>
 </tr>
 </thead>
 <tbody id="boardBody"></tbody>
 </table>
 </div>

 <div class="share">
 <strong style="color:var(--gold);letter-spacing:2px">SHARE</strong>
 <pre id="sharePreview">—</pre>
 <div class="nav" style="margin:0">
 <button type="button" id="genShare">GEN</button>
 <button type="button" id="copyShare">COPY</button>
 <a class="btn" id="tweetShare" href="#" target="_blank" rel="noopener">X</a>
 </div>
 <div class="status" id="status"></div>
 </div>

 <div class="nav">
 <a class="btn" href="/classic/pages/arcade/snowman/">PLAY</a>
 <a class="btn" href="/classic/pages/arcade/hub.html">ARCADE</a>
 <a class="btn" href="/classic/pages/arcade/scores.html">ALL</a>
 </div>
 </div>

 <script src="/assets/js/core/soft-score.js"></script>
 <script src="/assets/js/arcade/arcade-core.js?v=20260719b"></script>
 <script>
 (function () {
 var A = window.DOSWAPZ_ARCADE;
 var KEY = 'snowman_geoff_scores_v1';
 if (!A) return;

 var sc = A.loadSoftConnect();
 var h = document.getElementById('scHandle');
 var a = document.getElementById('scAlias');
 if (sc.handle) h.value = '@' + sc.handle;
 if (sc.alias) a.value = sc.alias;

 function loadBoard() {
 try {
 if (window.DOSWAPZ_SOFT_SCORE) return DOSWAPZ_SOFT_SCORE.loadBoard(KEY) || [];
 } catch (e) {}
 try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e2) { return []; }
 }

 function who(e) {
 if (e.handle) return '@' + e.handle;
 return e.name || e.alias || 'DEGEN';
 }

 function meKey() {
 var id = A.softIdentity();
 return id.handle ? 'h:' + id.handle.toLowerCase() : 'a:' + id.alias;
 }

 function entryKey(e) {
 return e.handle ? 'h:' + String(e.handle).toLowerCase() : 'a:' + String(e.name || e.alias || '');
 }

 function sortBoard(list) {
 return list.slice().sort(function (a, b) {
 var ga = a.geoffComplete ? 1 : 0;
 var gb = b.geoffComplete ? 1 : 0;
 if (gb !== ga) return gb - ga;
 if ((b.kills || 0) !== (a.kills || 0) && ga === gb && ga === 1) {
 // among finishers, score first already; kills as tiebreak after score
 }
 return (b.score || 0) - (a.score || 0) || (b.kills || 0) - (a.kills || 0);
 });
 }

 function render() {
 var d = A.getDailyChallenge();
 document.getElementById('dailyMode').textContent = d.mode + ' * ' + (d.blurb || '');
 document.getElementById('dailySeed').textContent = d.seed;
 document.getElementById('dailyDay').textContent = 'UTC DAY ' + d.day;

 var list = sortBoard(loadBoard());
 var best = list.length ? list[0].score : Number(localStorage.getItem('snowman_geoff_high') || 0);
 var finishes = list.filter(function (e) { return e.geoffComplete; }).length;
 document.getElementById('statBest').textContent = best ? Number(best).toLocaleString() : '—';
 document.getElementById('statGeoff').textContent = String(finishes);
 document.getElementById('statN').textContent = String(list.length);
 document.getElementById('statTag').textContent = A.softIdentity().tag;

 var mk = meKey();
 document.getElementById('boardBody').innerHTML = list.slice(0, 30).map(function (e, i) {
 var me = entryKey(e) === mk ? ' me' : '';
 var gr = e.geoffComplete ? ' geoff-row' : '';
 return '<tr class="' + (me + gr).trim() + '">' +
 '<td>' + (i + 1) + '</td>' +
 '<td>' + who(e) + (e.geoffComplete ? '<span class="badge">GEOFF 100%</span>' : '') + '</td>' +
 '<td>' + Number(e.score || 0).toLocaleString() + '</td>' +
 '<td>' + (e.geoffComplete ? 'YES' : 'no') + '</td>' +
 '<td>' + (e.kills != null ? e.kills : '—') + '</td>' +
 '<td>' + (e.parts != null ? e.parts + '/6' : '—') + '</td>' +
 '<td>' + (e.carrots != null ? e.carrots : '—') + '</td>' +
 '<td style="font-size:12px;color:#5a8098">' + (e.dailySeed ? String(e.dailySeed).slice(0, 8) : '—') + '</td>' +
 '</tr>';
 }).join('') || '<tr><td colspan="8">No runs yet — finish GEOFF or die trying, then post soft.</td></tr>';

 var top = list[0];
 var text = A.shareCard({
 game: 'SNOWMAN BUILDZ GEOFF',
 score: top ? top.score : (best || 0),
 extra: top
 ? ((top.geoffComplete ? '★ GEOFF 100% ONLINE * ' : 'Parts ' + (top.parts || 0) + '/6 * ') +
 (top.kills || 0) + ' kills * ' + (top.carrots || 0) + ' carrots' +
 (top.dailySeed ? ' * +DAILY' : ''))
 : 'No board tops yet * who boots GEOFF first?'
 });
 document.getElementById('sharePreview').textContent = text;
 document.getElementById('tweetShare').href = A.tweetUrl(text);
 }

 document.getElementById('scSave').onclick = function () {
 A.saveSoftConnect({ handle: h.value, alias: a.value });
 document.getElementById('status').textContent = 'Soft-connect saved * no wallet * no seed';
 render();
 };
 document.getElementById('genShare').onclick = function () {
 render();
 document.getElementById('status').textContent = 'Share card refreshed';
 };
 document.getElementById('copyShare').onclick = function () {
 A.copyText(document.getElementById('sharePreview').textContent).then(function (ok) {
 document.getElementById('status').textContent = ok ? 'Copied' : 'Copy failed';
 });
 };

 render();
 })();
 </script>
<script src="/assets/js/core/docs-footer.js?v=20260715e" data-docs-footer="1"></script>
<script src="/assets/js/core/shell-boot.js?v=20260906gag3" data-shell-boot="1"></script>
</body>
</html>
