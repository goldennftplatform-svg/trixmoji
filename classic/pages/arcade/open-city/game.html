<!DOCTYPE html>
<html lang="en">
<head><script src="/assets/js/core/access-gate.js?v=20261016gate"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPEN CITY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#fff}
#c{display:block;width:100%;height:100%;touch-action:none}
#err{display:none;position:fixed;inset:0;z-index:999;background:#200;color:#fcc;padding:16px;font:13px/1.45 Consolas,monospace;white-space:pre-wrap;overflow:auto}
.boot{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:20px}
.boot.hidden{display:none!important}
.bg{position:absolute;inset:0;background:#111 url("img/gta-street-a.jpg") center/cover no-repeat;filter:brightness(.5)}
.card{position:relative;z-index:1;width:min(420px,100%);background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.15);padding:18px}
.card h1{font-size:18px;letter-spacing:.12em;margin-bottom:8px}
.card p{font-size:13px;color:rgba(255,255,255,.75);line-height:1.45;margin-bottom:6px}
.card button{width:100%;margin-top:12px;border:0;padding:12px;cursor:pointer;font:600 12px system-ui;letter-spacing:.15em;text-transform:uppercase;background:#fff;color:#000}
.card button:disabled{opacity:.5;cursor:wait}
#st{margin-top:10px;font-size:12px;color:#8cf}
#log{margin-top:8px;font-size:11px;color:#8a8;max-height:100px;overflow:auto;white-space:pre-wrap}
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.top{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);font-size:12px}
.top a{pointer-events:auto;color:#9cf;text-decoration:none;border:1px solid rgba(255,255,255,.2);padding:5px 8px}
.bot{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 18px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);font-size:13px;color:rgba(255,255,255,.8)}
.bot b{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="err"></pre>
<div class="hud">
  <div class="top"><span>OPEN CITY</span><a href="/classic/pages/arcade/hub.html">Arcade</a></div>
  <div class="bot"><b>WASD</b> move Â· <b>click</b> for mouse look Â· <b>Shift</b> sprint</div>
</div>
<div class="boot" id="boot">
  <div class="bg"></div>
  <div class="card">
    <h1>OPEN CITY</h1>
    <p>Photoreal district walkaround (Imagine GTA-style plates).</p>
    <p>Bot is temporary.</p>
    <button id="go" type="button" disabled>LOADINGâ€¦</button>
    <div id="st">Startingâ€¦</div>
    <div id="log"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Not live — set true only for local prototype work
  var OPEN_CITY_LIVE = false;
  if (!OPEN_CITY_LIVE) {
    document.body.innerHTML = "<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050a08;color:#7a9a88;font-family:monospace;text-align:center;padding:24px\"><div><div style=\"color:#ff5577;letter-spacing:4px;font-size:14px;margin-bottom:10px\">// OFFLINE</div><h1 style=\"color:#667;letter-spacing:6px;font-size:28px;margin:0 0 12px\">OPEN CITY</h1><p style=\"max-width:360px;line-height:1.45;margin:0 auto 18px;color:#6a8a7a\">Not live. District proto is shelved.</p><a href=\"/classic/pages/arcade/hub.html\" style=\"color:#5ce090;border:1px solid #2a5040;padding:10px 16px;text-decoration:none;letter-spacing:2px\">&larr; ARCADE</a></div></div>";
    return;
  }


  function log(m) {
    console.log('[OpenCity]', m);
    var el = document.getElementById('log');
    if (el) el.textContent += m + '\n';
    var st = document.getElementById('st');
    if (st) st.textContent = m;
  }

  function fail(e) {
    var msg = (e && e.stack) ? e.stack : String(e);
    console.error(e);
    var box = document.getElementById('err');
    box.style.display = 'block';
    box.textContent = 'OPEN CITY ERROR\n\n' + msg;
  }

  window.addEventListener('error', function (ev) {
    // ignore resize noise etc after start
    if (ev && ev.message && String(ev.message).indexOf('Script error') === 0) return;
    fail(ev.error || ev.message);
  });
  window.addEventListener('unhandledrejection', function (ev) { fail(ev.reason); });

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(src); };
      s.onerror = function () { reject(new Error('Failed to load script: ' + src)); };
      document.head.appendChild(s);
    });
  }

  function solidTex(THREE, hex) {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g = c.getContext('2d');
    g.fillStyle = hex;
    g.fillRect(0, 0, 64, 64);
    var t = new THREE.Texture(c);
    t.needsUpdate = true;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(12, 12);
    return t;
  }

  function loadTex(THREE, path, repeat, fallback) {
    return fetch(path, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error(path + ' HTTP ' + res.status);
        return res.blob();
      })
      .then(function (blob) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(blob);
          var img = new Image();
          img.onload = function () {
            try {
              var t = new THREE.Texture(img);
              t.needsUpdate = true;
              if (t.colorSpace !== undefined && THREE.SRGBColorSpace !== undefined) {
                t.colorSpace = THREE.SRGBColorSpace;
              }
              if (repeat) {
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.repeat.set(repeat[0], repeat[1]);
              }
              log('OK ' + path);
              resolve(t);
            } catch (e) {
              reject(e);
            }
          };
          img.onerror = function () { reject(new Error('decode failed ' + path)); };
          img.src = url;
        });
      })
      .catch(function (err) {
        log('FALLBACK ' + path + ' Â· ' + err.message);
        return solidTex(THREE, fallback || '#444');
      });
  }

  function startGame(THREE) {
    log('Three ready Â· buildingâ€¦');

    var FILES = {
      street: 'img/gta-street-a.jpg',
      avenue: 'img/gta-avenue.jpg',
      cross: 'img/gta-intersection.jpg',
      pano: 'img/gta-panorama.jpg',
      asphalt: 'img/asphalt.jpg',
      bot: 'img/bot-placeholder.jpg'
    };

    var canvas = document.getElementById('c');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (renderer.outputColorSpace !== undefined && THREE.SRGBColorSpace !== undefined) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    }
    if (THREE.ACESFilmicToneMapping !== undefined) {
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
    }

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1018);
    scene.fog = new THREE.Fog(0x152030, 35, 115);

    var camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.12, 400);
    var clock = new THREE.Clock();

    Promise.all([
      loadTex(THREE, FILES.street, null, '#2a3545'),
      loadTex(THREE, FILES.avenue, null, '#1e2a38'),
      loadTex(THREE, FILES.cross, null, '#243040'),
      loadTex(THREE, FILES.pano, null, '#1a2430'),
      loadTex(THREE, FILES.asphalt, [16, 16], '#1a1a1a'),
      loadTex(THREE, FILES.bot, null, '#c0c8d0')
    ]).then(function (arr) {
      run(THREE, renderer, scene, camera, clock, {
        street: arr[0], avenue: arr[1], cross: arr[2],
        pano: arr[3], asphalt: arr[4], botFace: arr[5]
      });
    }).catch(fail);
  }

  function run(THREE, renderer, scene, camera, clock, maps) {
    log('Scene ready');

    scene.add(new THREE.HemisphereLight(0x8aa8c8, 0x0c0c12, 0.9));
    var sun = new THREE.DirectionalLight(0xffc090, 1.4);
    sun.position.set(30, 40, 15);
    scene.add(sun);
    var fill = new THREE.DirectionalLight(0x6690ff, 0.35);
    fill.position.set(-20, 15, -25);
    scene.add(fill);

    var ground = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ map: maps.asphalt, metalness: 0.15, roughness: 0.28 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    function wall(tex, w, h, x, y, z, ry) {
      var m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
      );
      m.position.set(x, y, z);
      m.rotation.y = ry;
      scene.add(m);
    }

    var L = 90, H = 28, W = 11;
    wall(maps.avenue, L, H, -W, H / 2, 0, Math.PI / 2);
    wall(maps.street, L, H, W, H / 2, 0, -Math.PI / 2);
    wall(maps.cross, L, H, 0, H / 2, -W, 0);
    wall(maps.street, L, H, 0, H / 2, W, Math.PI);
    wall(maps.street, W * 2.2, H, 0, H / 2, -L / 2 + 2, 0);
    wall(maps.avenue, W * 2.2, H, 0, H / 2, L / 2 - 2, Math.PI);
    wall(maps.cross, W * 2.2, H, -L / 2 + 2, H / 2, 0, Math.PI / 2);
    wall(maps.pano, W * 2.2, H, L / 2 - 2, H / 2, 0, -Math.PI / 2);

    var pano = new THREE.Mesh(
      new THREE.CylinderGeometry(95, 95, 42, 48, 1, true),
      new THREE.MeshBasicMaterial({
        map: maps.pano,
        side: THREE.BackSide,
        fog: false,
        depthWrite: false,
        transparent: true,
        opacity: 0.95
      })
    );
    pano.position.y = 16;
    scene.add(pano);

    var sc = document.createElement('canvas');
    sc.width = 4; sc.height = 256;
    var g = sc.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#0b1830');
    gr.addColorStop(0.55, '#2a3d5c');
    gr.addColorStop(0.8, '#c48a5a');
    gr.addColorStop(1, '#1a1418');
    g.fillStyle = gr;
    g.fillRect(0, 0, 4, 256);
    scene.add(new THREE.Mesh(
      new THREE.SphereGeometry(180, 20, 12),
      new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(sc),
        side: THREE.BackSide,
        fog: false,
        depthWrite: false
      })
    ));

    for (var i = -36; i <= 36; i += 14) {
      if (Math.abs(i) < 8) continue;
      [[8.5, i], [-8.5, i], [i, 8.5], [i, -8.5]].forEach(function (p) {
        var pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.09, 4.8, 8),
          new THREE.MeshStandardMaterial({ color: 0x1c1c20 })
        );
        pole.position.set(p[0], 2.4, p[1]);
        scene.add(pole);
        var light = new THREE.PointLight(0xffb060, 1.4, 15, 1.8);
        light.position.set(p[0], 4.6, p[1]);
        scene.add(light);
      });
    }

    // bot
    var bot = new THREE.Group();
    scene.add(bot);
    var white = new THREE.MeshStandardMaterial({ color: 0xe6ebf0, metalness: 0.5, roughness: 0.35 });
    var dark = new THREE.MeshStandardMaterial({ color: 0x2e3640, metalness: 0.55, roughness: 0.4 });
    var led = new THREE.MeshStandardMaterial({ color: 0x66e0ff, emissive: 0x2299bb, emissiveIntensity: 1.5 });

    var torso = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.28, 0.7, 12), white);
    torso.position.y = 1.05;
    bot.add(torso);
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 12), white);
    head.position.y = 1.62;
    bot.add(head);
    var face = new THREE.Mesh(
      new THREE.CircleGeometry(0.16, 20),
      new THREE.MeshStandardMaterial({ map: maps.botFace, roughness: 0.45 })
    );
    face.position.set(0, 1.64, 0.22);
    bot.add(face);
    var visor = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.05, 0.05), led);
    visor.position.set(0, 1.7, 0.24);
    bot.add(visor);

    function limb(r, len, mat, x, y) {
      var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);
      m.position.set(x, y, 0);
      return m;
    }
    var legL = limb(0.1, 0.45, dark, -0.13, 0.34);
    var legR = limb(0.1, 0.45, dark, 0.13, 0.34);
    var armL = limb(0.07, 0.4, white, -0.42, 1.05);
    var armR = limb(0.07, 0.4, white, 0.42, 1.05);
    bot.add(legL, legR, armL, armR);
    bot.position.set(0, 0, 4);

    var keys = {};
    var look = { x: 0, y: 0.38 };
    var vel = new THREE.Vector3();
    var camPos = new THREE.Vector3(0, 3, 10);
    var pointerLocked = false;
    var started = false;
    var BOUND = 42;
    var ROAD = 9.2;

    window.addEventListener('keydown', function (e) {
      keys[e.code] = true;
      if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    });
    window.addEventListener('keyup', function (e) { keys[e.code] = false; });
    document.getElementById('c').addEventListener('click', function () {
      if (started && canvas.requestPointerLock) canvas.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', function () {
      pointerLocked = document.pointerLockElement === canvas;
    });
    document.addEventListener('mousemove', function (e) {
      if (!pointerLocked) return;
      look.x -= e.movementX * 0.002;
      look.y = Math.max(0.05, Math.min(1.1, look.y - e.movementY * 0.0018));
    });

    function damp(a, b, l, dt) { return a + (b - a) * Math.min(1, l * dt); }

    function clampRoad(pos) {
      var onNS = Math.abs(pos.x) < ROAD;
      var onEW = Math.abs(pos.z) < ROAD;
      if (onNS || onEW) {
        pos.x = Math.max(-BOUND, Math.min(BOUND, pos.x));
        pos.z = Math.max(-BOUND, Math.min(BOUND, pos.z));
        if (!onNS && onEW) pos.z = Math.max(-ROAD + 0.3, Math.min(ROAD - 0.3, pos.z));
        if (onNS && !onEW) pos.x = Math.max(-ROAD + 0.3, Math.min(ROAD - 0.3, pos.x));
        return;
      }
      if (Math.abs(pos.x) < Math.abs(pos.z)) pos.x = (pos.x >= 0 ? 1 : -1) * (ROAD - 0.4);
      else pos.z = (pos.z >= 0 ? 1 : -1) * (ROAD - 0.4);
    }

    function tick() {
      requestAnimationFrame(tick);
      var dt = Math.min(0.05, clock.getDelta());
      var t = clock.elapsedTime;

      if (!started) {
        camera.position.set(Math.sin(t * 0.1) * 8, 2.8, 10);
        camera.lookAt(0, 1.4, 0);
        renderer.render(scene, camera);
        return;
      }

      var ix = 0, iz = 0;
      if (keys.KeyW || keys.ArrowUp) iz -= 1;
      if (keys.KeyS || keys.ArrowDown) iz += 1;
      if (keys.KeyA || keys.ArrowLeft) ix -= 1;
      if (keys.KeyD || keys.ArrowRight) ix += 1;
      var il = Math.hypot(ix, iz);
      if (il > 1) { ix /= il; iz /= il; }

      var sprint = keys.ShiftLeft || keys.ShiftRight;
      var speed = sprint ? 8.5 : 5;
      var yaw = look.x;
      var fx = Math.sin(yaw), fz = Math.cos(yaw);
      var rx = Math.cos(yaw), rz = -Math.sin(yaw);
      var wx = rx * ix + fx * (-iz);
      var wz = rz * ix + fz * (-iz);
      var wl = Math.hypot(wx, wz);

      if (wl > 0.001) {
        wx /= wl; wz /= wl;
        bot.rotation.y = Math.atan2(wx, wz);
        vel.x = damp(vel.x, wx * speed, 12, dt);
        vel.z = damp(vel.z, wz * speed, 12, dt);
      } else {
        vel.x = damp(vel.x, 0, 10, dt);
        vel.z = damp(vel.z, 0, 10, dt);
      }

      bot.position.x += vel.x * dt;
      bot.position.z += vel.z * dt;
      clampRoad(bot.position);

      var spd = Math.hypot(vel.x, vel.z);
      if (spd > 0.3) {
        var s = Math.sin(t * (sprint ? 12 : 9)) * 0.35;
        legL.rotation.x = s; legR.rotation.x = -s;
        armL.rotation.x = -s * 0.6; armR.rotation.x = s * 0.6;
      }

      var dist = 4.8;
      var ix2 = bot.position.x + Math.sin(look.x) * dist;
      var iy2 = bot.position.y + 1.7 + look.y * 0.9;
      var iz2 = bot.position.z + Math.cos(look.x) * dist;
      var k = 1 - Math.exp(-10 * dt);
      camPos.x += (ix2 - camPos.x) * k;
      camPos.y += (iy2 - camPos.y) * k;
      camPos.z += (iz2 - camPos.z) * k;
      camera.position.copy(camPos);
      camera.lookAt(bot.position.x, bot.position.y + 1.35, bot.position.z);

      pano.rotation.y += dt * 0.003;
      led.emissiveIntensity = 1.3 + Math.sin(t * 2.5) * 0.3;
      renderer.render(scene, camera);
    }
    requestAnimationFrame(tick);

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    var go = document.getElementById('go');
    go.disabled = false;
    go.textContent = 'ENTER CITY';
    log('Ready â€” click ENTER CITY');
    go.onclick = function () {
      document.getElementById('boot').classList.add('hidden');
      started = true;
      bot.position.set(0, 0, 3);
      look.x = 0;
      look.y = 0.35;
      try { canvas.requestPointerLock(); } catch (e) {}
    };
  }

  // ---- boot: load Three first (absolute path + CDN fallback) ----
  var THREE_SOURCES = [
    '/classic/pages/arcade/open-city/three.min.js',
    'three.min.js',
    'vendor/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js',
    'https://unpkg.com/three@0.149.0/build/three.min.js'
  ];

  function boot(i) {
    if (typeof window.THREE !== 'undefined') {
      log('Three.js already present');
      startGame(window.THREE);
      return;
    }
    if (i >= THREE_SOURCES.length) {
      fail(new Error(
        'Could not load Three.js from any source.\nTried:\n- ' +
        THREE_SOURCES.join('\n- ') +
        '\n\nMake sure the local server is running:\nhttp://127.0.0.1:8890'
      ));
      return;
    }
    var src = THREE_SOURCES[i];
    log('Loading Three.js: ' + src);
    loadScript(src).then(function () {
      if (typeof window.THREE === 'undefined') {
        log('Script loaded but THREE missing, trying nextâ€¦');
        boot(i + 1);
        return;
      }
      log('Three.js OK');
      startGame(window.THREE);
    }).catch(function (err) {
      log(String(err.message || err));
      boot(i + 1);
    });
  }

  boot(0);
})();
</script>
</body>
</html>
