function updateGameImage(special = null) {
 let src = "/assets/images/cryptomom/kitchen.svg";
 if (special === "good_ending") src = "/assets/images/cryptomom/victory.svg";
 else if (special === "game_over" || special === "eviction") src = "/assets/images/cryptomom/eviction.svg";

function print(text, color = '#ddbbff') {
 const line = document.createElement('div');
 line.className = 'line';
 line.style.color = color;
 line.textContent = text;
 terminal.appendChild(line);
 terminal.scrollTop = terminal.scrollHeight;
}
function clearTerminal() { terminal.innerHTML = ''; }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function fmt(n) { return Math.floor(n).toLocaleString(); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function totalNetWorth() { return gameState.liquid + gameState.savings; }

function getHustleHoursRemaining() {
 return Math.max(0, MAX_HUSTLE_HOURS - (gameState.hustleHoursUsed || 0));
}
function formatHustleClock() {
 const r = getHustleHoursRemaining();
 return String(Math.floor(r)).padStart(2, '0') + ':' + String(Math.floor((r % 1) * 60)).padStart(2, '0');
}

async function consumeHustleHours(hours, label) {
 const remaining = getHustleHoursRemaining();
 if (remaining <= 0) {
 print("⏱️ Your 20-hour hustle window is CLOSED this week.", "red");
 print("Kids need you. The week advances...", "yellow");
 await delay(420);
 await advanceWeek();
 return 'blocked';
 }
 if (hours > remaining) {
 print(`⏱️ Only ${formatHustleClock()} left - not enough for ${label}.`, "red");
 gameState.hustleHoursUsed = MAX_HUSTLE_HOURS;
 await delay(420);
 await advanceWeek();
 return 'exhausted';
 }
 gameState.hustleHoursUsed += hours;
 print(`⏱️ ${label} (~${hours}h) - ${formatHustleClock()} left`, "gray");
 if (getHustleHoursRemaining() <= 0) {
 print("⏱️ Hustle window EXHAUSTED. Week advances...", "yellow");
 await delay(500);
 await advanceWeek();
 return 'exhausted';
 }
 return 'ok';
}

function calculateFinalScore() {
 let s = 0;
 s += Math.floor(gameState.kids * 22);
 s += Math.floor((100 - gameState.stress) * 11);
 s += Math.floor((gameState.week - 1) * 115);
 s += Math.floor(totalNetWorth() / 95);
 s += gameState.rentPaid * 200;
 s -= gameState.arrests * 310;
 if (gameState.cpsFlag) s -= 420;
 if (gameState.evicted) s -= 520;
 if (gameState.kidsTaken) s -= 480;
 if (gameState.gigBanned) s -= 220;
 s -= Math.floor(gameState.risk * 4.5);
 if (gameState.risk < 18 && gameState.kids > 68) s = Math.floor(s * 1.14);
 if (gameState.mode === 'arcade') s = Math.floor(s * 0.96);
 return Math.max(120, Math.min(12500, Math.floor(s)));
}

 if (gameEnded) return;

 const score = calculateFinalScore();
 localStorage.setItem('pending_cryptomom_score', JSON.stringify({
 score, mode: gameState.mode, ending: endingType,
 ts: new Date().toISOString().slice(0, 16).replace('T', ' ')

 print("You will be asked to log it with a soft signature (no funds, no tx permission).", "white");
 print("");
 currentMenu = "ended";
 setTimeout(() => {
 window.location.href = '/classic/pages/basement/cryptomom/scoreboard.html';

}

 if (gameState.burner) gear.push("📱 Burner");

}

 const kidDecay = gameState.mode === 'arcade' ? 3 : 6;
 const stressGain = gameState.mode === 'arcade' ? 2 : 4;
 gameState.kids = clamp(gameState.kids - kidDecay, 0, 100);
 gameState.stress = clamp(gameState.stress + stressGain, 0, 100);
 if (gameState.risk > 0) gameState.risk = clamp(gameState.risk - 2, 0, 100);
}

 let cost = 0, kidHit = 0, msg = "";
 if (roll < 0.09) { cost = 680; kidHit = 4; msg = "🚽 Toilet exploded at 3am. Plumber wants $680 or he's not coming."; }

}

function handleRentTick() {
 gameState.rentDueIn--;
 if (gameState.rentDueIn > 0) return false;
 print("🏠 RENT IS DUE.", "yellow");
 if (gameState.liquid >= gameState.rentAmount) {
 gameState.liquid -= gameState.rentAmount;
 gameState.rentPaid++;
 gameState.rentDueIn = 4;
 gameState.stress = clamp(gameState.stress - 6, 0, 100);
 print(`Paid rent: -$${fmt(gameState.rentAmount)}`, "green");
 return false;
 }
 const short = gameState.rentAmount - gameState.liquid;
 gameState.liquid = 0;
 print(`SHORT $${fmt(short)} ON RENT.`, "red");
 if (gameState.mode === 'arcade' && !gameState.evicted && gameState.rentPaid === 0) {
 print("Arcade mercy: landlord gives ONE more week.", "yellow");
 gameState.rentDueIn = 1;
 return false;
 }

 gameState.evicted = true;
 print("📦 EVICTION NOTICE. Your key doesn't work anymore.", "red");
 updateGameImage("eviction");
 setTimeout(() => endRun('evicted'), 480);
 return true;
 }
 return false;
}

async function handleCommand(raw) {
 const cmd = raw.trim().toUpperCase();
 if (currentMenu === "processing") return;
 if (gameEnded) { print("Run over. Refresh to replay.", "red"); return; }
 print(`> ${cmd}`, "white");

 if (currentMenu === "intro") { clearTerminal(); await startGame(); return; }

 if (currentMenu === "choose-mode") {
 if (cmd === "2" || cmd === "ARCADE") {
 gameState.mode = 'arcade';
 gameState.rentAmount = 1200;
 print("ARCADE - softer decay, one rent mercy, ~1.5% night crime rate.", "yellow");
 } else {
 gameState.mode = 'realistic';
 print("REALISTIC - validated 500k sim experience. ~3% night crime rate.", "red");
 }
 print("");
 print("Crypto Dad lost everything. You're 38, two kids, $680, rent in 4 weeks.", "white");
 print("Balance KIDS, STRESS, RISK, and RENT. Too much risk brings cuffs.", "cyan");
 showStats();
 updateGameImage();
 print("Week 1 auto: cooked from scratch. Kids +12, Stress -8, Risk -4, -$28");
 gameState.kids = clamp(gameState.kids + 12, 0, 100);
 gameState.stress = clamp(gameState.stress - 8, 0, 100);
 gameState.risk = clamp(gameState.risk - 4, 0, 100);
 gameState.liquid = Math.max(0, gameState.liquid - 28);
 gameState.week = 1;
 print("Week 1 complete. Choose week 2 action.");
 currentMenu = "main";
 await showMainMenu();
 return;
 }

 if (currentMenu === "nsfw-ack") {
 if (cmd === "YES") {
 gameState.nsfwAck = true;
 print("Night Shift acknowledged.", "pink");
 if (gameState._pendingNight) {
 const lvl = gameState._pendingNight;
 delete gameState._pendingNight;
 await doNightShift(lvl);
 } else await hustleMenu();
 } else {
 delete gameState._pendingNight;
 await showMainMenu();
 }
 return;
 }

 if (currentMenu === "jail") {
 const n = parseInt(cmd);
 if ([1,2,3,4].includes(n)) await resolveJail(n);
 return;
 }

 if (currentMenu === "police") {
 const n = parseInt(cmd);
 if ([1,2,3,4].includes(n)) await resolvePolice(n);
 return;
 }

 if (currentMenu === "main") {
 if (cmd === "1") await hustleMenu();
 else if (cmd === "2") await kidsMenu();
 else if (cmd === "3") await foodMenu();
 else if (cmd === "4") await bankMenu();
 else if (cmd === "5") await storeMenu();
 else if (cmd === "6") { currentMenu = "processing"; await advanceWeek(); }
 else if (cmd === "7") await supportCryptoMomToken();
 return;
 }

 if (currentMenu === "hustle") {
 const n = parseInt(cmd);
 if (n === 1) await cardPulls();
 else if (n === 2) await doordash();
 else if (n === 3) await sellRigs();
 else if (n === 4) await onlyFansGray();
 else if (n === 5) await doNightShift(1);
 else if (n === 6) await doNightShift(2);
 else if (n === 7) await doNightShift(3);
 else if (n === 8) await streetPromo();
 else if (n === 9) await hotelHustle();
 else if (cmd === "0") await showMainMenu();
 return;
 }

 if (currentMenu === "card-pulls-amount") {
 let amt = parseFloat(cmd);
 if (cmd.includes("%")) amt = gameState.liquid * (parseFloat(cmd) / 100);
 await doCardPulls(Math.floor(amt));
 return;
 }

 if (currentMenu === "hotel") {
 const n = parseInt(cmd);
 if ([1,2,3].includes(n)) await resolveHotel(n);
 else await hustleMenu();
 return;
 }

 if (currentMenu === "kids") {
 const n = parseInt(cmd);
 if (n >= 1 && n <= 5) await doKids(n);
 else if (cmd === "0") await showMainMenu();
 return;
 }

 if (currentMenu === "food") {
 const n = parseInt(cmd);
 if (n >= 1 && n <= 3) await doFood(n);
 else if (cmd === "0") await showMainMenu();
 return;
 }

 if (currentMenu === "doorstep") {
 const n = parseInt(cmd);
 if (n >= 1 && n <= 4) await resolveDoorstep(n);
 return;
 }

 if (currentMenu === "bank") {
 if (cmd === "1") { print("Stash what %?"); currentMenu = "bank-deposit"; }
 else if (cmd === "2") { print("Pull what %?"); currentMenu = "bank-withdraw"; }
 else if (cmd === "3") await doPrepayRent();
 else if (cmd === "0") await showMainMenu();
 return;
 }
 if (currentMenu === "bank-deposit") { await doDeposit(parseFloat(cmd) || 0); return; }
 if (currentMenu === "bank-withdraw") { await doWithdraw(parseFloat(cmd) || 0); return; }

 if (currentMenu === "store") {
 const n = parseInt(cmd);
 if ([1,2,3].includes(n)) await buyStore(n);
 else if (cmd === "0") await showMainMenu();
 return;
 }
