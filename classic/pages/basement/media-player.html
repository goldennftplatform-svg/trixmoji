<!DOCTYPE html>
<html lang="en">
<head><script src="/assets/js/core/access-gate.js?v=20261016gate"></script>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>DOSWAPZ // MEDIA PLAYER</title>
 <meta name="robots" content="noindex">
 <meta name="description" content="Basement digital media player — JayFeezy and Slumpork library, CRT visualizer.">
 <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='16' fill='%23ffaa00' text-anchor='middle'%3EFM%3C/text%3E%3C/svg%3E">
 <link rel="stylesheet" href="/assets/css/doswapz-shell.css?v=20260715e">
 <link rel="stylesheet" href="/assets/css/boombox-v2.css?v=bbv33">
</head>
<body>
 <div class="dos-screen" id="screen">
  <div class="header">
   <h1>DOSWAPZ // MEDIA PLAYER</h1>
   <div class="sub">CRT DECK * LIBRARY LIVE * BOOM BOX SOON</div>
  </div>
  <div class="hud" id="hud">
   <span><b id="hudFreq">98.7</b> FM</span>
   <span id="hudName">READY</span>
   <span id="hudMode">PLAYER</span>
   <span id="hudVol">VOL 7</span>
   <span id="hudAnt">ANT 7</span>
  </div>

  <div class="toast" id="toast"></div>

  <div class="stage" id="stage">
   <div class="rig" id="rig">
    <div class="view is-gone" id="boomView" style="opacity:0;">
     <img class="skin" id="boxImg" src="/assets/images/boombox/v2/boombox-no-ant.jpg" alt="voxel boom box" draggable="false">
     <div class="ant" id="ant">
      <div class="ant-mast" id="antMast">
       <div class="ant-seg"></div>
       <div class="ant-tip"></div>
      </div>
     </div>
    </div>

    <div class="view is-live" id="playerView" style="transform: scale(1);">
     <div class="art" id="playerArt">
      <img class="skin" id="playerImg" src="/assets/images/boombox/v2/player-skin.jpg" alt="digital media player" draggable="false">
      <canvas id="fxLayer"></canvas>
      <canvas id="viz" width="240" height="168"></canvas>
      <div class="lib-screen is-on" id="libScreen"></div>
      <img class="img-cap" id="playCap" src="/assets/images/boombox/v2/play.png" alt="" draggable="false">
      <img class="img-cap" id="knobCap" src="/assets/images/boombox/v2/knob.png" alt="" draggable="false">
      <button type="button" class="hit" id="pFile" title="FILE" style="left:15.4%;top:31.6%;width:14.2%;height:6.4%;"></button>
      <button type="button" class="hit" id="pPlay" title="PLAY" style="left:71.719%;top:59.444%;width:3.438%;height:5.556%;"></button>
      <button type="button" class="hit circle" id="pKnob" title="VOL" style="left:68.359%;top:67.083%;width:11.016%;height:19.583%;"></button>
      <button type="button" class="hit" id="pBack" title="ZOOM OUT" style="left:7.4%;top:7.2%;width:3.2%;height:5.6%;"></button>
     </div>
    </div>
   </div>
   <div class="probe" id="probe"></div>
  </div>

  <div class="bar">
   <button type="button" class="dbtn on" id="btnPower">POWER</button>
   <button type="button" class="dbtn" id="btnPlay">PLAY</button>
   <button type="button" class="dbtn" id="btnStop">STOP</button>
   <button type="button" class="dbtn" id="btnRew">REW</button>
   <button type="button" class="dbtn" id="btnFf">FF</button>
   <button type="button" class="dbtn" id="btnHits">HITS</button>
   <button type="button" class="dbtn" id="btnBoom">BOOM BOX SOON</button>
   <button type="button" class="dbtn on" id="btnDigital">PLAYER</button>
   <button type="button" class="dbtn" id="btnLib">LIBRARY</button>
  </div>
  <div class="hint">
   LEFT SCREEN = ARTISTS / TRACKS * GREEN KEY = PLAY * TWIST THE KNOB
  </div>
  <div class="nav">
   <a href="/classic/pages/basement.html" class="btn btn-basement">&lt;- BASEMENT</a>
   <a href="/classic/hub.html" class="btn">MENU</a>
  </div>
 </div>

 <video id="deckVideo" playsinline loop crossorigin="anonymous" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none"></video>
 <audio id="deckAudio"></audio>
 <script src="/assets/js/core/page-transition.js" data-page-transition="1"></script>
 <script src="/assets/js/core/site-shell.js?v=20260715d" data-site-shell="1"></script>
 <script src="/assets/js/basement/boombox-v2.js?v=bbv36"></script>
</body>
</html>
