 <script>
 (function () {
 // Static title only - matrix title morph caused layout reflow / "shake"
 var title = document.getElementById('harbingerTitle');
 if (title) title.textContent = 'H4RB1NG3R';

 var cfg = window.DOSWAPZ_HARBINGER_CONFIG || {};
 var head = document.getElementById('hbHeadImg');
 if (head && cfg.headUrl) {
 head.src = cfg.headUrl + (cfg.headUrl.indexOf('?') >= 0 ? '&' : '?') + 'v=noshake2';
 }

 function boot() {
 var stage = document.getElementById('stage');
 if (window.HARBINGER_FLOAT && stage) {
 HARBINGER_FLOAT.mount(stage, {
 shardsOnly: true,
 width: stage.clientWidth || 260,
 height: stage.clientHeight || 280
 });
 }
 if (window.DOSWAPZ_ERA) DOSWAPZ_ERA.set('past');
 if (window.HARBINGER_LLM) {
 HARBINGER_LLM.bindUi({
 status: 'hbLlmStatus',
 log: 'hbChatLog',
 input: 'hbChatInput',
 send: 'hbChatSend',
 form: 'hbChatForm'
 });
 }
 }
 if (document.readyState === 'complete') boot();
 else window.addEventListener('load', boot);
 })();
 </script>
