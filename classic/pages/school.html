["LEVEL 0 // START FROM ZERO","What does centralized mean?","Centralized means control or record keeping is concentrated in one main authority or small group.","One teacher has the master gradebook."],
["LEVEL 0 // START FROM ZERO","What does decentralized mean?","Decentralized means control or record keeping is distributed across multiple independent participants.","Instead of one master notebook, many people keep matching copies."],
["LEVEL 1 // BITCOIN","What is Bitcoin?","Bitcoin is a decentralized digital currency and payment network that uses a public blockchain.","Imagine internet-native money with a public transaction history."],

["LEVEL 2 // BLOCKCHAIN","What is a blockchain?","A blockchain is a shared, ordered record of data organized into blocks and linked together using cryptography.","Think of a public notebook whose pages are connected."],
["LEVEL 2 // BLOCKCHAIN","What is a block?","A block is a batch of transactions or other data accepted into a blockchain's ordered history.","A block is like one page added to the shared notebook."],
["LEVEL 2 // BLOCKCHAIN","What is a node?","A node is a computer running blockchain software that participates in the network.","Think of nodes as independent rule-checkers."],
["LEVEL 2 // BLOCKCHAIN","What is consensus?","Consensus is how network participants agree on which valid state or history the network recognizes.","It keeps independent computers from all keeping different official histories."],
["LEVEL 3 // WALLETS","What is a crypto wallet?","A wallet is software or hardware that manages the cryptographic keys used to interact with blockchain assets.","A wallet is more like a key ring than a physical box holding coins."],
["LEVEL 3 // WALLETS","Where is my crypto?","Blockchain assets are represented by records on a blockchain. A wallet manages the keys that let you authorize actions.","The ledger records the state; your wallet helps you prove you can act."],
["LEVEL 3 // WALLETS","What is a private key?","A private key is secret cryptographic information used to authorize transactions.","Treat it like a secret master key."],
["LEVEL 3 // WALLETS","What is a seed phrase?","A recovery phrase can restore wallet keys, depending on the wallet standard.","Anyone who gets it may be able to control the assets in that wallet."],
["LEVEL 4 // ETHEREUM","What is Ethereum?","Ethereum is a blockchain platform designed to support programmable smart contracts and decentralized applications.","Think of it as a shared computer network that can run agreed-upon programs."],
["LEVEL 4 // ETHEREUM","What is ETH?","ETH is the native asset of the Ethereum network.","ETH is used within Ethereum for fees and other network functions."],
["LEVEL 4 // ETHEREUM","What is a smart contract?","A smart contract is blockchain-deployed code that executes according to its programmed rules.","It is a program whose state and execution are handled by a blockchain."],
["LEVEL 5 // SOLANA","What is Solana?","Solana is a blockchain designed for high-throughput applications, using proof of stake alongside Proof of History.","Think of Solana as a blockchain engineered to process lots of activity quickly."],
["LEVEL 5 // SOLANA","What is SOL?","SOL is Solana's native asset and is used for network fees and other functions.","SOL is the native asset and fuel of the Solana network."],
["LEVEL 5 // SOLANA","What is Proof of History?","Proof of History is a cryptographic timing mechanism used by Solana to help establish ordering and timing.","Think of it as a verifiable clock-like sequence that helps coordinate events."],
["LEVEL 5 // SOLANA","What are Solana programs?","Solana separates accounts that hold state from executable programs that contain logic.","Think of accounts as data containers and programs as the instructions."],
["LEVEL 6 // THE REST OF CRYPTO","What is a token?","A token is a blockchain-based asset or unit represented by a protocol or smart-contract standard.","A token can represent many things depending on the system that creates it."],

["LEVEL 7 // SECURITY","The seed phrase rule","Never share your recovery phrase or private key. Legitimate support should not need it.","Treat it like the master key to everything controlled by that wallet."],
