 <script>
 const screen = document.getElementById('screen');
 const content = document.getElementById('content');
 const doswapText = document.getElementById('doswapText');
 const enterHere = document.getElementById('enterHere');
 const glitchLayer = document.getElementById('glitchLayer');
 const shutdownCursor = document.getElementById('shutdownCursor');
 const tubePower = document.getElementById('tubePower');

 let isShutdown = false;
 let glitchInterval = null;
 let shutdownTimeout = null;

 const SPLASH_COLORS = ['#00ff00', '#ffff00', '#ff00ff', '#00ffff', '#ff4444', '#ff8800', '#88ff88'];
 const TITLE = 'DOSWAPZ';

 function pickColor() {
 return SPLASH_COLORS[Math.floor(Math.random() * SPLASH_COLORS.length)];
 }

 function renderTitle(letters) {
 doswapText.innerHTML = letters.map(ch => {
 if (ch.color) {
 return '<span class="color-letter" style="color:' + ch.color + '">' + ch.ch + '</span>';
 }
 return ch.ch || ch;
 }).join('');
 }

 function resetTitle() {
 if (!isShutdown) doswapText.textContent = TITLE;
 }

 // === HARD PIXEL GLITCH + MOSHDATA ENGINE ===

 function createHardPixelBlock() {
 const block = document.createElement('div');
 block.className = 'glitch-layer';
 block.style.background = 'transparent';
 block.style.zIndex = '22';

 const x = Math.random() * 100;
 const y = Math.random() * 100;
 const w = 2 + Math.random() * 7;
 const h = 1.2 + Math.random() * 4.5;

 block.style.left = x + '%';
 block.style.top = y + '%';
 block.style.width = w + '%';
 block.style.height = h + '%';

 const roll = Math.random();
 if (roll < 0.38) {
 block.style.background = '#00ff00';
 block.style.opacity = (0.65 + Math.random() * 0.35).toString();
 block.style.mixBlendMode = 'difference';
 } else if (roll < 0.58) {
 block.style.background = '#000000';
 block.style.opacity = (0.75 + Math.random() * 0.25).toString();
 } else {
 block.style.background = pickColor();
 block.style.mixBlendMode = 'screen';
 block.style.opacity = (0.65 + Math.random() * 0.35).toString();
 block.style.boxShadow = '0 0 6px ' + block.style.background;
 }

 if (Math.random() < 0.35) {
 block.style.fontFamily = 'VT323, monospace';
 block.style.fontSize = (18 + Math.random() * 14) + 'px';
 block.style.color = pickColor();
 block.style.lineHeight = '1';
 block.style.whiteSpace = 'pre';
 block.innerHTML = Array.from({length: Math.floor(h * 1.6)}, () =>
 '#$%@&*+='.split('')[Math.floor(Math.random() * 8)]).join('<br>');
 }

 glitchLayer.appendChild(block);

 setTimeout(() => {
 block.style.transition = 'opacity 60ms linear';
 block.style.opacity = '0';
 setTimeout(() => block.remove(), 70);
 }, 55 + Math.random() * 85);
 }

 function createColorFlash() {
 if (isShutdown) return;
 const flash = document.createElement('div');
 const color = pickColor();
 flash.style.position = 'absolute';
 flash.style.left = Math.random() * 92 + '%';
 flash.style.top = Math.random() * 88 + '%';
 flash.style.width = (3 + Math.random() * 5) + 'px';
 flash.style.height = (3 + Math.random() * 5) + 'px';
 flash.style.background = color;
 flash.style.boxShadow = '0 0 10px ' + color + ', 0 0 22px ' + color;
 flash.style.zIndex = '24';
 flash.style.mixBlendMode = 'screen';
 flash.style.opacity = '0.95';
 glitchLayer.appendChild(flash);
 setTimeout(() => {
 flash.style.transition = 'opacity 45ms linear, transform 45ms linear';
 flash.style.opacity = '0';
 flash.style.transform = 'scale(2.2)';
 setTimeout(() => flash.remove(), 50);
 }, 35 + Math.random() * 40);
 }

 function createMoshBand() {
 const band = document.createElement('div');
 band.className = 'mosh-band';
 const y = Math.random() * 94;
 band.style.top = y + '%';
 band.style.height = (6 + Math.random() * 9) + 'px';
 band.style.opacity = (0.6 + Math.random() * 0.4).toString();

 // Random horizontal offset (classic data mosh)
 const offset = (Math.random() - 0.5) * 38;
 band.style.transform = `translateX(${offset}px)`;

 if (Math.random() < 0.35) {
 const c = pickColor();
 band.style.background = c;
 band.style.mixBlendMode = 'screen';
 band.style.boxShadow = '0 0 8px ' + c;
 }

 screen.appendChild(band);

 setTimeout(() => {
 band.style.transition = 'opacity 90ms linear, transform 90ms linear';
 band.style.opacity = '0';
 setTimeout(() => band.remove(), 100);
 }, 70 + Math.random() * 110);
 }

 function scrambleTitle() {
 if (isShutdown) return;
 const garbage = '#$%@&*+=<>/\\|';
 const letters = TITLE.split('').map(ch => ({
 ch: Math.random() < 0.6 ? garbage[Math.floor(Math.random() * garbage.length)] : ch,
 color: Math.random() < 0.42 ? pickColor() : null
 }));
 renderTitle(letters);
 setTimeout(resetTitle, 90 + Math.random() * 70);
 }

 function flashRandomLetter() {
 if (isShutdown) return;
 const idx = Math.floor(Math.random() * TITLE.length);
 const color = pickColor();
 const letters = TITLE.split('').map((ch, i) => ({
 ch: ch,
 color: i === idx ? color : null
 }));
 renderTitle(letters);
 setTimeout(resetTitle, 110 + Math.random() * 90);
 }

 function fullScreenScrambleReset() {
 if (isShutdown) return;

 const oldOpacity = content.style.opacity;
 content.style.transition = 'none';
 content.style.opacity = '0.15';

 // Fill screen with noise blocks
 for (let i = 0; i < 11; i++) {
 setTimeout(() => {
 if (!isShutdown) createHardPixelBlock();
 }, i * 7);
 }

 setTimeout(() => {
 if (!isShutdown) {
 content.style.transition = 'opacity 70ms linear';
 content.style.opacity = oldOpacity || '1';
 }
 }, 130);
 }

 function doAmbientGlitch() {
 if (isShutdown) return;

 const r = Math.random();

 if (r < 0.32) {
 for (let i = 0; i < (1 + Math.random() * 2.5); i++) {
 createHardPixelBlock();
 }
 } else if (r < 0.48) {
 createColorFlash();
 if (Math.random() < 0.4) createColorFlash();
 } else if (r < 0.61) {
 createMoshBand();
 if (Math.random() < 0.4) createMoshBand();
 } else if (r < 0.74) {
 scrambleTitle();
 } else if (r < 0.84) {
 flashRandomLetter();
 } else if (r < 0.93) {
 // Occasional bigger mosh + pixel combo
 createMoshBand();
 createHardPixelBlock();
 createHardPixelBlock();
 } else if (r < 0.975) {
 // Rare surface glitch (watery reflection + CRT corruption)
 doWaterGlitch();
 } else {
 // Very rare full screen scramble + reset
 fullScreenScrambleReset();
 }
 }

 function startGlitchEngine() {
 if (glitchInterval) clearInterval(glitchInterval);
 glitchInterval = setInterval(() => {
 if (!isShutdown) doAmbientGlitch();
 }, 47);
 }

 // === RANDOM FULL SHUTDOWN + OLD TUBE TV REBOOT ===

 function triggerRandomShutdown() {
 if (isShutdown) return;
 isShutdown = true;

 // Kill normal glitches
 if (glitchInterval) {
 clearInterval(glitchInterval);
 glitchInterval = null;
 }

 // Hide main content fast
 content.style.transition = 'opacity 55ms linear';
 content.style.opacity = '0';

 // Show lonely cursor in corner (classic DOS "dead" state)
 setTimeout(() => {
 shutdownCursor.style.display = 'block';
 shutdownCursor.style.animation = 'blink 480ms steps(1) infinite';
 }, 90);

 // Hold the dead screen for a bit (feels like power died)
 const holdTime = 1450 + Math.random() * 780;

 setTimeout(() => {
 // Start the reboot / tube power-on sequence
 rebootSequence();
 }, holdTime);
 }

 function rebootSequence() {
 // Clear the lonely cursor
 shutdownCursor.style.display = 'none';
 shutdownCursor.style.animation = '';

 // Brief complete black
 screen.style.background = '#000000';

 // CLASSIC OLD TUBE TV TURN-ON EFFECT
 tubePower.style.display = 'block';
 tubePower.style.top = '50%';
 tubePower.style.height = '0';
 tubePower.style.opacity = '0.98';

 // Expand the bright horizontal line (the moment the tube gets high voltage)
 setTimeout(() => {
 tubePower.style.transition = 'height 380ms cubic-bezier(0.22, 0.95, 0.3, 1), top 380ms linear';
 tubePower.style.top = '0';
 tubePower.style.height = '100vh';
 }, 40);

 // As the raster blooms, bring the content back with slight phosphor pop
 setTimeout(() => {
 content.style.transition = 'opacity 420ms linear';
 content.style.opacity = '1';
 screen.style.background = '#000000';
 }, 310);

 // Finish the power-on bloom and resume normal operation
 setTimeout(() => {
 tubePower.style.transition = 'opacity 180ms linear';
 tubePower.style.opacity = '0';

 setTimeout(() => {
 tubePower.style.display = 'none';
 tubePower.style.opacity = '0.95';
 tubePower.style.transition = '';
 isShutdown = false;

 // Resume the glitch engine
 startGlitchEngine();

 // Small boot glitch burst after coming back
 setTimeout(() => {
 if (!isShutdown) {
 for (let i = 0; i < 4; i++) {
 setTimeout(() => createHardPixelBlock(), i * 28);
 }
 }
 }, 180);

 // Schedule the next random shutdown
 scheduleNextRandomShutdown();
 }, 220);
 }, 820);
 }

 function scheduleNextRandomShutdown() {
 if (shutdownTimeout) clearTimeout(shutdownTimeout);

 // Random interval between ~18s and ~52s (feels unpredictable like old hardware)
 const nextIn = 18200 + Math.random() * 33800;

 shutdownTimeout = setTimeout(() => {
 if (!isShutdown) {
 triggerRandomShutdown();
 }
 }, nextIn);
 }

 // === ENTRY BEHAVIOR (click or key) ===

 function performEntry() {
 if (isShutdown) return;

 // Kill scheduled random shutdown
 if (shutdownTimeout) clearTimeout(shutdownTimeout);

 // One dramatic controlled shutdown + tube reboot, then navigate
 isShutdown = true;
 if (glitchInterval) {
 clearInterval(glitchInterval);
 glitchInterval = null;
 }

 content.style.transition = 'opacity 50ms linear';
 content.style.opacity = '0';

 setTimeout(() => {
 shutdownCursor.style.display = 'block';
 }, 70);

 // Shorter hold for intentional entry
 setTimeout(() => {
 shutdownCursor.style.display = 'none';

 // Tube power-on
 tubePower.style.display = 'block';
 tubePower.style.top = '50%';
 tubePower.style.height = '0';
 tubePower.style.opacity = '0.98';

 setTimeout(() => {
 tubePower.style.transition = 'height 340ms cubic-bezier(0.2, 0.9, 0.3, 1)';
 tubePower.style.top = '0';
 tubePower.style.height = '100vh';
 }, 30);

 setTimeout(() => {
 // Navigate after the beautiful tube turn-on
 // Local preview -> test map so every era/page is reachable.
 // Production still boots into the classic past hub.
 var host = window.location.hostname || '';
 var local = host === '127.0.0.1' || host === 'localhost';
 window.location.href = local ? '/test.html' : '/classic/hub.html';
 }, 680);
 }, 980);
 }

 // Click on "enter here" or anywhere on the screen
 enterHere.addEventListener('click', (e) => {
 e.stopImmediatePropagation();
 performEntry();
 });

 // Direct CTAs - do not run tube boot (swap/docs are precision strikes)
 var splashCta = document.getElementById('splashCta');
 if (splashCta) {
 splashCta.addEventListener('click', function (e) {
 var a = e.target.closest('a');
 if (!a) return;
 e.stopPropagation();
 if (a.getAttribute('data-entry') === '1') {
 e.preventDefault();
 performEntry();
 }
